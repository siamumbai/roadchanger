<head>

  <meta property="og:site_name" content="DJ Roadchanger" />
  <meta property="og:title" content="Live Harp — Roadchanger | Riga, Latvia" />
  <meta property="og:description" content="Harp will make your moment stand out with its marvelous look and sound that carries ancient vibes. The Harp set is mixed with complementary electronic instruments and beats to create a unique, uplifting feeling for everyone around." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    /* Header - tāds pats kā galvenajā lapā (bez Book now) */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { font-size: 13px; color: #8A6840; text-decoration: none; letter-spacing: 0.05em; }
    .nav-links a:hover { color: #B07320; }

    /* Bildes - kartiņas platumā, augstums dabiskais */
    .media-section { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem 3rem; }
    .media-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #2C2416;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .media-subtitle {
      font-size: 15px;
      color: #7A5C38;
      line-height: 1.7;
      font-weight: 300;
      max-width: 640px;
      margin-bottom: 2rem;
    }
    .mobile-br { display: none; }
    .media-card {
      border-radius: 10px;
      overflow: hidden;
      border: 0.5px solid #E0CCA4;
      box-shadow: 0 4px 18px rgba(44,36,22,0.08);
      background: #1E1810;
    }
    .media-card + .media-card { margin-top: 1.5rem; }
    .media-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .nav-links { display: none; }
      .mobile-br { display: inline; }
      .media-section { padding: 0.75rem 1rem 1.25rem; }
      .media-title { font-size: 24px; margin-bottom: 0.3rem; }
      .media-subtitle { font-size: 14px; margin-bottom: 1.25rem; }
      .media-card + .media-card { margin-top: 0.6rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
    <div class="nav-links">
      <a href="/dj/">DJ sets</a>
      <a href="/fire/">Fire show</a>
      <a href="/#about">About</a>
    </div>
  </nav>

  <div class="media-section">
    <h1 class="media-title">Live Harp</h1>
    <p class="media-subtitle">Harp will make your moment stand out with its marvelous look and sound that carries ancient vibes. The Harp set is mixed with complementary electronic instruments and beats to create a unique, uplifting feeling for everyone around.</p>
    <div class="media-card">
      <img src="/images/harp1.jpg" alt="Live harp and saxophone" />
    </div>
  </div>

</body>
</html>
