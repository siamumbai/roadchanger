<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Live Harp — Roadchanger | Riga, Latvia</title>
  <meta name="description" content="Harp will make your moment stand out with its marvelous look and sound that carries ancient vibes. The Harp set is mixed with complementary electronic instruments and beats to create a unique, uplifting feeling for everyone around." />
  <link rel="canonical" href="https://roadchanger.com/arfa/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DJ Roadchanger" />
  <meta property="og:title" content="Live Harp — Roadchanger | Riga, Latvia" />
  <meta property="og:description" content="Harp will make your moment stand out with its marvelous look and sound that carries ancient vibes. The Harp set is mixed with complementary electronic instruments and beats to create a unique, uplifting feeling for everyone around." />
  <meta property="og:url" content="https://roadchanger.com/arfa/" />
  <meta property="og:image" content="https://roadchanger.com/images/arfa3.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    /* Header - tāds pats kā galvenajā lapā (bez Book now) */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { font-size: 13px; color: #8A6840; text-decoration: none; letter-spacing: 0.05em; }
    .nav-links a:hover { color: #B07320; }

    /* Bildes - kartiņas platumā, augstums dabiskais */
    .media-section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 3rem; }
    .media-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #2C2416;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .media-subtitle {
      font-size: 15px;
      color: #7A5C38;
      line-height: 1.7;
      font-weight: 300;
      max-width: 640px;
      margin-bottom: 2rem;
    }
    .mobile-br { display: none; }
    /* Kolāža: bildes dažādos izmēros, kolonnas nesakrīt rindās */
    .rz-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(26, minmax(0, 1fr));
      aspect-ratio: 12 / 13;
      margin: 0 -0.25rem;
    }
    .rz { position: relative; }
    .rz img {
      position: absolute;
      top: 0.25rem;
      left: 0.25rem;
      width: calc(100% - 0.5rem);
      height: calc(100% - 0.5rem);
      object-fit: cover;
      display: block;
      border-radius: 6px;
      border: 0.5px solid #DEC898;
    }
    .h1 { grid-area: 1 / 1 / 19 / 7; }
    .h4 { grid-area: 1 / 7 / 8 / 13; }
    .h3 { grid-area: 8 / 7 / 18 / 10; }
    .h8 { grid-area: 8 / 10 / 19 / 13; }
    .h2 { grid-area: 18 / 7 / 27 / 10; }
    .h7 { grid-area: 19 / 10 / 27 / 13; }
    .h5 { grid-area: 19 / 1 / 27 / 7; }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .nav-links { display: none; }
      .mobile-br { display: inline; }
      .media-section { padding: 0.75rem 1rem 1.25rem; }
      .media-title { font-size: 24px; margin-bottom: 0.3rem; }
      .media-subtitle { font-size: 14px; margin-bottom: 1.25rem; }
      .rz-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(52, minmax(0, 1fr));
        aspect-ratio: 6 / 26;
        margin: 0 -0.125rem;
      }
      .rz img {
        top: 0.125rem;
        left: 0.125rem;
        width: calc(100% - 0.25rem);
        height: calc(100% - 0.25rem);
      }
      .h1 { grid-area: 1 / 1 / 19 / 7; }
      .h4 { grid-area: 19 / 1 / 27 / 7; }
      .h3 { grid-area: 27 / 1 / 36 / 4; }
      .h8 { grid-area: 27 / 4 / 38 / 7; }
      .h2 { grid-area: 36 / 1 / 45 / 4; }
      .h7 { grid-area: 38 / 4 / 45 / 7; }
      .h5 { grid-area: 45 / 1 / 53 / 7; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
    <div class="nav-links">
      <a href="/dj/">DJ sets</a>
      <a href="/fire/">Fire show</a>
      <a href="/#about">About</a>
    </div>
  </nav>

  <div class="media-section">
    <h1 class="media-title">Live Harp</h1>
    <p class="media-subtitle">Harp will make your moment stand out with its marvelous look and sound that carries ancient vibes. The Harp set is mixed with complementary electronic instruments and beats to create a unique, uplifting feeling for everyone around.</p>
    <div class="rz-grid">
      <div class="rz h1"><img src="/images/arfa3.jpg" alt="Harpist with a red flower crown, close up" /></div>
      <div class="rz h4"><img src="/images/arfa4.jpg" alt="Harpist beside a red Live Roses performer" style="object-position:center 85%;" /></div>
      <div class="rz h3"><img src="/images/arfa1.jpg" alt="Harpist in red playing a golden harp" /></div>
      <div class="rz h8"><img loading="lazy" decoding="async" src="/images/arfa8.jpg" alt="Harpist seen through the harp strings" /></div>
      <div class="rz h2"><img loading="lazy" decoding="async" src="/images/arfa2.jpg" alt="Harpist playing, seen from behind" style="object-position:center 60%;" /></div>
      <div class="rz h7"><img loading="lazy" decoding="async" src="/images/arfa7.jpg" alt="Harpist and red Live Roses performer in an event hall" /></div>
      <div class="rz h5"><img loading="lazy" decoding="async" src="/images/arfa6.jpg" alt="Harpist with Live Roses performers and guests" /></div>
    </div>
  </div>

</body>
</html>
