<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>roadchanger rider</title>
  <meta name="description" content="Technical rider — Roadchanger." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    /* Header - tikai logo */
    nav {
      display: flex;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }

    /* Bilde - centrēta, augstums dabiskais */
    .rider-section { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem 3rem; }
    .rider-card {
      border-radius: 10px;
      overflow: hidden;
      border: 0.5px solid #E0CCA4;
      box-shadow: 0 4px 18px rgba(44,36,22,0.08);
      background: #FFFBF5;
    }
    .rider-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .rider-section { padding: 1rem 1rem 2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
  </nav>

  <div class="rider-section">
    <div class="rider-card">
      <img src="/images/rider1.jpg" alt="Technical rider" />
    </div>
  </div>

</body>
</html>
