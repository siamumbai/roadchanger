<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Roadchanger scenārijs</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; zoom: 0.9; min-height: 100vh; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    button:disabled { opacity: 0.55; cursor: default; }

    /* ---------- Paroles logs ---------- */
    .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card {
      width: 100%; max-width: 26rem; background: #FFFBF5;
      border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07);
      padding: clamp(1.75rem, 4vw, 2.5rem); text-align: center;
    }
    .card-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2C2416; text-decoration: none; }
    .card h1 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.6rem; font-weight: 400; margin: 1.25rem 0 1.5rem; }
    .login-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .field { width: 100%; padding: 0.75rem 0.9rem; border: 0.5px solid #E0CCA4; border-radius: 8px; background: #fff; font-size: 0.95rem; }
    .field:focus { outline: none; border-color: #B07320; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.9rem; letter-spacing: 0.04em; }
    .btn-dark { background: #2C2416; color: #F5ECD8; }
    .btn-dark:hover { background: #3D3020; }
    .btn-brown { background: #B07320; color: #fff; }
    .btn-brown:hover { background: #9A6418; }
    .btn-line { border: 0.5px solid #E0CCA4; background: #fff; }
    .btn-line:hover { border-color: #B07320; }
    .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.82rem; }
    .msg { margin-top: 1rem; font-size: 0.9rem; color: #6B5035; min-height: 1.2em; }
    .msg.err { color: #A33A2A; }

    /* ---------- Navigācija ---------- */
    .topnav {
      display: flex; align-items: center; gap: clamp(1rem, 3vw, 2.5rem);
      padding: 1.1rem 3rem; background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8; position: sticky; top: 0; z-index: 50;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-title { font-size: 14px; letter-spacing: 0.05em; color: #8A6840; }
    .nav-user { margin-left: auto; font-size: 13px; color: #8A6840; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Admin: projektu saraksts ---------- */
    .wrap { padding: 2.5rem 3rem 4rem; max-width: 72rem; margin: 0 auto; }
    .wrap-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.75rem; }
    .wrap-head h1 { font-family: 'Libre Baskerville', Georgia, serif; font-size: clamp(1.4rem, 2.2vw, 1.8rem); font-weight: 400; }
    .head-actions { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem; }
    .hist-link { font-size: 0.85rem; color: #8A6840; text-decoration: underline; text-underline-offset: 3px; }
    .hist-link:hover { color: #B07320; }
    .proj.arch { background: #FEF9F2; }
    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1.25rem; }
    .empty { color: #7A5C38; font-size: 0.95rem; }
    .proj {
      background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); padding: 1.3rem 1.4rem;
      display: flex; flex-direction: column; gap: 0.9rem;
    }
    .proj-top { display: flex; align-items: baseline; gap: 0.75rem; }
    .proj h2 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.15rem; font-weight: 400; overflow-wrap: anywhere; }
    .lang { margin-left: auto; flex: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: #B07320; border: 0.5px solid #E0CCA4; border-radius: 4px; padding: 0.1rem 0.4rem; }
    .pw-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .pw { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; }
    .pw-label { flex: none; width: 8.5rem; color: #7A5C38; }
    .pw-val {
      flex: 1; min-width: 0; text-align: left; font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
      background: #FEF9F2; border: 0.5px solid #EAD9B8; border-radius: 6px; padding: 0.3rem 0.55rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pw-val:hover { border-color: #B07320; }
    .proj-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* ---------- Modālais logs ---------- */
    .scrim { position: fixed; inset: 0; background: rgba(44, 36, 22, 0.35); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 1rem; overflow-y: auto; }
    .modal {
      width: 100%; max-width: 30rem; background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 12px 36px rgba(44, 36, 22, 0.18); padding: 1.6rem;
    }
    .modal h2 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.3rem; font-weight: 400; margin-bottom: 1.25rem; }
    .modal label { display: block; font-size: 0.8rem; letter-spacing: 0.04em; color: #7A5C38; margin: 0.9rem 0 0.35rem; }
    .modal .row { display: flex; gap: 0.5rem; }
    .modal .row .field { flex: 1; min-width: 0; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
    .danger-zone { margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid #EAD9B8; }
    .modal-sec { margin-top: 1.4rem; padding-top: 1rem; border-top: 0.5px solid #EAD9B8; font-family: 'Libre Baskerville', Georgia, serif; font-size: 1rem; }
    .arch-link { font-size: 0.85rem; color: #8A6840; text-decoration: underline; text-underline-offset: 3px; }
    .arch-link:hover { color: #B07320; }
    .danger-link { font-size: 0.82rem; color: #A33A2A; text-decoration: underline; text-underline-offset: 3px; }
    .btn-danger { background: #A33A2A; color: #fff; }

    .nav-back { font-size: 14px; letter-spacing: 0.05em; color: #8A6840; }
    .nav-back:hover { color: #B07320; }

    /* ---------- Scenārijs ---------- */
    .sheet-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(14rem, 19vw, 17rem); gap: 1.75rem; padding: 2rem 3rem 4rem; align-items: start; }
    .ev-title { font-family: 'Libre Baskerville', Georgia, serif; font-size: clamp(1.9rem, 3vw, 2.6rem); margin-bottom: 1rem; }
    .venue-map { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
    .desc { resize: none; overflow: hidden; line-height: 1.5; min-height: 5.5rem; }
    .desc[readonly] { border-color: transparent; background: transparent; padding-left: 0; min-height: 0; }
    .venue-time { position: relative; margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-start; }
    .time-range { display: flex; align-items: center; gap: 0.6rem; }
    .tr-slot { position: relative; }
    .tr-dash { color: #7A5C38; }
    .venue-time .c-time { width: 7rem; border: 0.5px solid #EAD9B8; border-radius: 6px; }
    .venue-time .tp { left: 0; top: 100%; }
    .venue { display: grid; grid-template-columns: minmax(0, 1fr) clamp(16rem, 30vw, 24rem); gap: 1.5rem; margin-bottom: 2rem; align-items: start; }
    .venue-text { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
    .venue-label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5C38; }
    .plain { width: 100%; border: 0.5px solid transparent; border-radius: 6px; background: transparent; padding: 0.3rem 0.45rem; margin-left: -0.45rem; }
    .plain:not([readonly]):hover { border-color: #EAD9B8; background: #fff; }
    .plain:not([readonly]):focus { outline: none; border-color: #B07320; background: #fff; }
    .plain[readonly] { cursor: default; }
    .venue-name { font-family: 'Libre Baskerville', Georgia, serif; font-size: clamp(1.5rem, 2.4vw, 2rem); }
    .venue-addr { font-size: 1rem; color: #6B5035; }
    .addr-row { display: flex; gap: 0.5rem; align-items: center; }
    .addr-row .plain { flex: 1; min-width: 0; }
    #map { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; border: 0.5px solid #E0CCA4; background: #FEF9F2; z-index: 0; }

    .toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .toolbar .spacer { flex: 1; }

    .sheet { background: #fff; border: 0.5px solid #E0CCA4; border-radius: 10px; box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); }
    .srow { display: grid; grid-template-columns: 2.25rem 7.5rem minmax(0, 1.2fr) minmax(0, 1fr) 4.5rem; border-bottom: 0.5px solid #EAD9B8; transition: opacity 0.15s, background 0.15s; position: relative; }
    .srow:last-child { border-bottom: none; }
    .srow > * { min-width: 0; }
    .shead { border-radius: 10px 10px 0 0; background: #FEF9F2; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5C38; }
    .shead > div { padding: 0.65rem 0.6rem; }
    .cell { width: 100%; border: none; background: transparent; padding: 0.65rem 0.6rem; font-size: 0.95rem; line-height: 1.45; resize: none; overflow: hidden; display: block; }
    .cell:focus { outline: none; background: #FFFBF5; box-shadow: inset 0 0 0 1.5px #B07320; }
    .cell[readonly] { cursor: default; }
    .cell[readonly]:focus { background: transparent; box-shadow: none; }
    .c-time { font-variant-numeric: tabular-nums; font-weight: 700; text-align: left; align-self: start; cursor: pointer; }
    .c-time:not(:disabled):hover { background: #FFFBF5; }
    .c-time:disabled { opacity: 1; cursor: default; }
    .c-time.ph { color: #C4A06A; font-weight: 400; }

    .tp {
      position: absolute; top: 2.6rem; left: 2.25rem; z-index: 60; width: 17.5rem;
      background: #fff; border: 0.5px solid #E0CCA4; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(44, 36, 22, 0.14); padding: 0.75rem;
    }
    .tp-label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5C38; margin: 0.15rem 0 0.4rem; }
    .tp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.25rem; margin-bottom: 0.6rem; }
    .tp-grid button { padding: 0.4rem 0; border-radius: 6px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .tp-grid button:hover { background: #FDF5E6; }
    .tp-grid button.on { background: #2C2416; color: #F5ECD8; }
    .tp-grid button.hint { background: #FDEBD3; color: #8A5410; }
    .tp-clear { font-size: 0.8rem; color: #8A6840; text-decoration: underline; text-underline-offset: 3px; }
    .c-note { color: #6B5035; }
    .cw { position: relative; min-width: 0; transition: background 0.15s; }
    .w-note, .w-cn { border-left: 0.5px solid #F2E6CF; }
    .w-cn, .h-cn { display: none; }
    .sheet.withcat .srow { grid-template-columns: 2.25rem 7.5rem minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) 4.5rem; }
    .sheet.withcat .w-cn, .sheet.withcat .h-cn { display: block; }
    .w-cn { background: #FFFBF5; }
    .h-cn { color: #B07320; }
    .cw.painted { background: #FAD7A8; }
    .cw .cell:focus { background: rgba(255, 251, 245, 0.6); }
    .paint {
      display: none; position: absolute; top: 0.45rem; right: 0.35rem; width: 0.95rem; height: 0.95rem;
      border-radius: 3px; border: 1.5px solid #E08A1E; background: #fff; opacity: 0; transition: opacity 0.12s;
    }
    .sheet.paintable .paint { display: block; }
    .sheet.paintable .cw:hover .paint, .sheet.paintable .cw:focus-within .paint { opacity: 1; }
    .cw.painted .paint { background: #E08A1E; opacity: 1; }
    @media (hover: none) { .sheet.paintable .paint { opacity: 0.6; } }

    .arrive { background: #fff; border: 0.5px solid #E0CCA4; border-left: 3px solid #E08A1E; border-radius: 10px; box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); padding: 1rem 1.2rem; margin-bottom: 1.25rem; }
    .arrive-title { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.1rem; margin-bottom: 0.6rem; }
    .arrive-row { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; align-items: start; }
    .arrive-time { position: relative; }
    .arrive-time .tp { left: 0; top: 100%; }
    .arrive .cell { border: 0.5px solid #EAD9B8; border-radius: 6px; margin-top: 0.3rem; }
    .arrive .c-time { width: 100%; }
    .mark, .del, .ins { display: flex; align-items: flex-start; justify-content: center; padding-top: 0.75rem; color: #C4A06A; }
    .r-act { display: flex; justify-content: flex-end; padding-right: 0.25rem; }
    .r-act button { width: 2rem; }
    .mark span { width: 1.05rem; height: 1.05rem; border-radius: 50%; border: 1.5px solid #E08A1E; display: block; }
    .mark.on span { background: #E08A1E; }
    .mark:disabled, .del:disabled, .ins:disabled { visibility: hidden; }
    .del { font-size: 1.1rem; line-height: 1; }
    .del:hover { color: #A33A2A; }
    .ins { font-size: 1.25rem; line-height: 0.85; }
    .ins:hover { color: #B07320; }

    /* Dzēšanas apstiprinājums */
    .cfm {
      position: absolute; right: 0.4rem; top: 2.4rem; z-index: 65; white-space: nowrap;
      display: flex; align-items: center; gap: 0.5rem;
      background: #fff; border: 0.5px solid #E0CCA4; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(44, 36, 22, 0.14); padding: 0.55rem 0.7rem; font-size: 0.85rem;
    }
    .cfm button { padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.82rem; }
    .cfm .yes { background: #A33A2A; color: #fff; }
    .cfm .no { border: 0.5px solid #E0CCA4; }
    .srow.hl { box-shadow: inset 3px 0 0 #E08A1E; }
    .srow.dim { opacity: 0.4; }
    .sheet-empty { padding: 1.25rem; color: #7A5C38; font-size: 0.9rem; }

    .cats { background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px; box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); padding: 1.1rem; position: sticky; top: 5.5rem; }
    .cats h3 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.05rem; font-weight: 400; margin-bottom: 0.8rem; }
    .cat-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .cat { display: flex; align-items: center; gap: 0.4rem; position: relative; }
    .cat-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; text-align: left; padding: 0.5rem 0.7rem; border-radius: 8px; border: 0.5px solid #E0CCA4; background: #FFFBF5; font-size: 0.9rem; }
    .cat-btn:hover { border-color: #E08A1E; }
    .cat-btn .n { margin-left: auto; font-size: 0.75rem; color: #7A5C38; }
    .cat-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat.sel .cat-btn { background: #E08A1E; border-color: #E08A1E; color: #fff; }
    .cat.sel .cat-btn .n { color: #fff; }
    .cat-x { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; color: #A33A2A; font-size: 1rem; }
    .cat-x:hover { background: #F6E3DF; }
    .cat-add { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    .cat-add .field { padding: 0.5rem 0.65rem; font-size: 0.88rem; }

    .toast {
      position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 100;
      background: #2C2416; color: #F5ECD8; padding: 0.7rem 1.2rem; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 6px 20px rgba(44, 36, 22, 0.25);
    }

    @media (max-width: 768px) {
      .topnav { padding: 1rem 1.25rem; }
      .wrap { padding: 1.75rem 1.25rem 3rem; }
      .projects { grid-template-columns: minmax(0, 1fr); }
      .pw-label { width: 7rem; }
      .sheet-wrap { grid-template-columns: minmax(0, 1fr); padding: 1.5rem 1.25rem 3rem; gap: 1.25rem; }
      .sheet-wrap aside { order: -1; }
      .venue { grid-template-columns: minmax(0, 1fr); }
      .cats { position: static; }
      .cat-list { flex-direction: row; flex-wrap: wrap; }
      .cat-btn { flex: none; }
      .srow { grid-template-columns: 2.25rem 5.5rem minmax(0, 1fr) 4.5rem; }
      .srow .w-ev { grid-column: 3; }
      .srow .w-note { grid-column: 2 / 4; grid-row: 2; border-left: none; }
      .srow .w-note .cell { padding-top: 0; }
      .srow .w-cn { grid-column: 2 / 4; grid-row: 3; border-left: none; }
      .sheet.withcat .srow { grid-template-columns: 2.25rem 5.5rem minmax(0, 1fr) 4.5rem; }
      .sheet.withcat .h-cn { display: none; }
      .arrive-row { grid-template-columns: minmax(0, 1fr); }
      .srow .r-act { grid-column: 4; grid-row: 1; }
      .shead .h-note { display: none; }
    }
  </style>
</head>
<body>

  <!-- Paroles logs -->
  <div class="center-screen" id="gate" hidden>
    <div class="card">
      <a class="card-logo" href="/">Roadchanger</a>
      <h1>Scenārijs</h1>
      <form class="login-form" id="gate-form">
        <input class="field" id="gate-pw" type="password" placeholder="Parole / Password" autocomplete="current-password" required />
        <button class="btn btn-dark" type="submit" id="gate-btn">Ieiet / Enter</button>
      </form>
      <div class="msg" id="gate-msg"></div>
    </div>
  </div>

  <!-- Admin -->
  <div id="admin" hidden>
    <nav class="topnav">
      <a class="nav-logo" href="/">Roadchanger</a>
      <span class="nav-title">Scenāriji · Admin</span>
      <button class="nav-user" data-logout>Iziet</button>
    </nav>
    <main class="wrap">
      <div class="wrap-head">
        <h1 id="admin-title">Projekti</h1>
        <div class="head-actions">
          <button class="btn btn-brown" id="new-btn">+ Jauns projekts</button>
          <button class="hist-link" id="hist-btn">Vēsture</button>
        </div>
      </div>
      <div class="projects" id="projects"></div>
      <p class="empty" id="projects-empty" hidden></p>
    </main>
  </div>

  <!-- Scenārijs (klients un admins) -->
  <div id="sheet" hidden>
    <nav class="topnav">
      <a class="nav-logo" href="/">Roadchanger</a>
      <button class="nav-back" id="back-btn" hidden>← Projekti</button>
      <button class="nav-user" data-logout data-t="logout"></button>
    </nav>
    <div class="sheet-wrap">
      <main>
        <section class="venue">
          <div class="venue-text">
            <input class="plain ev-title" id="v-title" maxlength="200" />
            <input class="plain venue-name" id="v-name" maxlength="200" />
            <span class="venue-label" style="margin-top:0.6rem" data-t="desc"></span>
            <textarea class="field desc" id="v-desc" rows="3" maxlength="5000"></textarea>
            <div class="venue-time">
              <span class="venue-label" data-t="guests"></span>
              <div class="time-range">
                <span class="tr-slot"><button class="cell c-time" type="button" id="v-guests"></button></span>
                <span class="tr-dash">–</span>
                <span class="tr-slot"><button class="cell c-time" type="button" id="v-end"></button></span>
              </div>
            </div>
          </div>
          <div class="venue-map">
            <span class="venue-label" data-t="city"></span>
            <input class="plain venue-addr" id="v-city" maxlength="100" />
            <span class="venue-label" style="margin-top:0.4rem" data-t="address"></span>
            <div class="addr-row">
              <input class="plain venue-addr" id="v-addr" maxlength="300" />
              <button class="btn btn-line btn-sm" id="v-find" data-t="find"></button>
            </div>
            <div id="map"></div>
          </div>
        </section>

        <section class="arrive" id="arrive" hidden>
          <div class="arrive-title" id="arrive-title"></div>
          <div class="arrive-row">
            <div class="arrive-time">
              <span class="venue-label" data-t="arrive"></span>
              <button class="cell c-time" type="button" id="arr-t"></button>
            </div>
            <div class="arrive-note">
              <span class="venue-label" data-t="note"></span>
              <textarea class="cell" id="arr-note" rows="1" maxlength="2000"></textarea>
            </div>
          </div>
        </section>

        <div class="toolbar">
          <span class="spacer"></span>
          <button class="btn btn-line btn-sm" id="edit-btn"></button>
        </div>
        <div class="sheet" id="rows">
          <div class="srow shead">
            <div></div><div data-t="time"></div><div data-t="event"></div><div class="h-note" data-t="note"></div><div class="h-cn" id="h-cn"></div><div></div>
          </div>
        </div>
        <div class="toolbar" style="margin-top:0.75rem">
          <button class="btn btn-dark btn-sm" id="add-row" data-t="addRow"></button>
        </div>
      </main>

      <aside class="cats">
        <h3 data-t="cats"></h3>
        <div class="cat-list" id="cat-list"></div>
        <form class="cat-add" id="cat-add">
          <input class="field" id="cat-name" maxlength="40" />
          <button class="btn btn-line btn-sm" type="submit">+</button>
        </form>
      </aside>
    </div>
  </div>

  <!-- Projekta forma -->
  <div class="scrim" id="modal" hidden>
    <form class="modal" id="proj-form">
      <h2 id="modal-title">Jauns projekts</h2>

      <label for="f-name">Nosaukums</label>
      <input class="field" id="f-name" maxlength="120" required />

      <label for="f-lang">Valoda</label>
      <select class="field" id="f-lang">
        <option value="lv">Latviešu</option>
        <option value="en">English</option>
      </select>

      <label for="f-rw">Parole: lasīt / rakstīt</label>
      <div class="row"><input class="field" id="f-rw" maxlength="60" required /><button type="button" class="btn btn-line btn-sm" data-gen="f-rw">Ģenerēt</button></div>

      <label for="f-ro">Parole: tikai lasīt</label>
      <div class="row"><input class="field" id="f-ro" maxlength="60" required /><button type="button" class="btn btn-line btn-sm" data-gen="f-ro">Ģenerēt</button></div>

      <div class="modal-sec">Kategorijas</div>
      <div id="f-cats"></div>

      <div class="msg err" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-line" id="modal-cancel">Atcelt</button>
        <button type="submit" class="btn btn-dark" id="modal-save">Saglabāt</button>
      </div>

      <div class="danger-zone" id="danger" hidden>
        <button type="button" class="arch-link" id="arch-btn"></button>
      </div>
    </form>
  </div>

  <!-- Laika izvēle -->
  <div class="tp" id="tp" hidden>
    <div class="tp-label" data-t="hours"></div>
    <div class="tp-grid" id="tp-h"></div>
    <div class="tp-label" data-t="minutes"></div>
    <div class="tp-grid" id="tp-m"></div>
    <button type="button" class="tp-clear" id="tp-clear" data-t="clear"></button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, orderBy,
      onSnapshot, getDocs, writeBatch, serverTimestamp, arrayUnion, arrayRemove
    } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyD7NhjgDjoaaqFHoqdKzbp-k_PI_DYDG4A',
      authDomain: 'roadchanger-kalendars.firebaseapp.com',
      projectId: 'roadchanger-kalendars',
      storageBucket: 'roadchanger-kalendars.firebasestorage.app',
      messagingSenderId: '333346997656',
      appId: '1:333346997656:web:c576e5b8bfdd8aa03497ed'
    });
    const auth = getAuth(app);
    const db = getFirestore(app);

        const ROLE_LABEL = { rw: 'Lasīt / rakstīt', ro: 'Tikai lasīt' };
    const DEFAULT_CATS = {
      lv: [
        { id: 'dj', name: 'DJ' },
        { id: 'vaditajs', name: 'Vadītājs' },
        { id: 'skana', name: 'Skaņa/Gaisma' },
        { id: 'keiterings', name: 'Keiterings' },
        { id: 'dekoracijas', name: 'Dekorācijas' }
      ],
      en: [
        { id: 'dj', name: 'DJ' },
        { id: 'vaditajs', name: 'Host' },
        { id: 'skana', name: 'Sound/Lights' },
        { id: 'keiterings', name: 'Catering' },
        { id: 'dekoracijas', name: 'Decorations' }
      ]
    };
    // Scenārija teksti projekta valodā (valodu izvēlas admins).
    const T = {
      lv: { logout: 'Iziet', title: 'Pasākuma nosaukums', desc: 'Apraksts', guests: 'Viesi ierodas', city: 'Pilsēta', venue: 'Vieta', address: 'Adrese', find: 'Atrast kartē', time: 'Laiks', event: 'Notikums',
            note: 'Komentārs', addRow: '+ Rinda', cats: 'Kategorijas', edit: 'Labot', done: 'Gatavs', newCat: 'Jauna kategorija',
            empty: 'Vēl nav nevienas rindas.', notFound: 'Adrese nav atrasta', hours: 'Stundas', minutes: 'Minūtes', clear: 'Notīrīt',
            arrive: 'Ierašanās laiks', delRow: 'Izdzēst rindu?', delCat: 'Izdzēst kategoriju?', yes: 'Jā', no: 'Nē' },
      en: { logout: 'Log out', title: 'Event title', desc: 'Description', guests: 'Guests arrive', city: 'City', venue: 'Venue', address: 'Address', find: 'Find on map', time: 'Time', event: 'Event',
            note: 'Comment', addRow: '+ Row', cats: 'Categories', edit: 'Edit', done: 'Done', newCat: 'New category',
            empty: 'No rows yet.', notFound: 'Address not found', hours: 'Hours', minutes: 'Minutes', clear: 'Clear',
            arrive: 'Arrival time', delRow: 'Delete row?', delCat: 'Delete category?', yes: 'Yes', no: 'No' }
    };
    const SID_KEY = 'rc-scenarijs-sid';

    const $ = id => document.getElementById(id);
    const screens = ['gate', 'admin', 'sheet'];
    function show(name) { screens.forEach(s => { $(s).hidden = s !== name; }); }

    let toastTimer;
    function toast(text) {
      const t = $('toast'); t.textContent = text; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
    }

    // Paroles nav reģistrjutīgas: "LONAS-7k3" = "lonas-7k3".
    const norm = s => s.trim().toLowerCase();
    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const indexId = pw => sha256('scn:' + pw);

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

    // ---------- Sesijas atjaunošana ----------
    let unsubProjects = null;
    let started = false;
    onAuthStateChanged(auth, async user => {
      if (started) return;
      started = true;
      if (!user) { show('gate'); return; }
      try {
        if ((await getDoc(doc(db, 'scnAdmins', user.uid))).exists()) { openAdmin(); return; }
      } catch {}
      const sid = lsGet(SID_KEY);
      if (sid) {
        try {
          const m = await getDoc(doc(db, 'scenarios', sid, 'members', user.uid));
          if (m.exists()) { openScenario(sid, m.data().role, m.data().cat); return; }
        } catch {}
      }
      show('gate');
    });

    // ---------- Ieeja ar paroli ----------
    $('gate-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = norm($('gate-pw').value);
      if (!pw) return;
      const msg = $('gate-msg');
      msg.textContent = ''; msg.classList.remove('err');
      $('gate-btn').disabled = true;
      try {
        const user = auth.currentUser || (await signInAnonymously(auth)).user;
        const idx = await getDoc(doc(db, 'scnIndex', await indexId(pw)));
        if (idx.exists()) {
          const { sid, role, cat } = idx.data();
          const mref = doc(db, 'scenarios', sid, 'members', user.uid);
          try { await deleteDoc(mref); } catch {}
          await setDoc(mref, { pw, role, ...(role === 'cat' ? { cat } : {}), at: serverTimestamp() });
          lsSet(SID_KEY, sid);
          openScenario(sid, role, cat);
        } else {
          await setDoc(doc(db, 'scnAdmins', user.uid), { pw, at: serverTimestamp() });
          openAdmin();
        }
        $('gate-pw').value = '';
      } catch (err) {
        console.error(err);
        msg.textContent = err.code === 'auth/admin-restricted-operation' || err.code === 'auth/operation-not-allowed'
          ? 'Pieteikšanās šobrīd nav pieejama.'
          : 'Nepareiza parole / Wrong password';
        msg.classList.add('err');
      } finally {
        $('gate-btn').disabled = false;
      }
    });

    document.querySelectorAll('[data-logout]').forEach(b => b.addEventListener('click', async () => {
      if (unsubProjects) { unsubProjects(); unsubProjects = null; }
      closeScenario();
      const uid = auth.currentUser?.uid;
      if (uid) { try { await deleteDoc(doc(db, 'scnAdmins', uid)); } catch {} }
      lsSet(SID_KEY, null);
      await signOut(auth);
      show('gate');
    }));

    // ---------- Scenārijs ----------
    // S = atvērtais scenārijs. role: 'admin' | 'rw' | 'ro' | 'cat' (cat = kategorijas id).
    let S = null;
    let map = null, marker = null;
    const tr = k => (T[S?.data?.lang] || T.lv)[k];
    const canWrite = () => S && (S.role === 'admin' || S.role === 'rw');
    const canRow = r => canWrite() || (S.role === 'cat' && (r.cats || []).includes(S.cat));
    const sref = () => doc(db, 'scenarios', S.sid);
    const rref = id => doc(db, 'scenarios', S.sid, 'rows', id);

    // Rakstīšana ar nelielu aizturi, lai katrs burts nav atsevišķs ieraksts.
    const timers = new Map();
    function later(key, fn) {
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => { timers.delete(key); fn(); }, 400));
    }
    const fail = e => { console.error(e); toast('Neizdevās saglabāt / Could not save'); };

    function closeScenario() {
      if (!S) return;
      S.unsubs.forEach(u => u());
      closeTp();
      S = null;
    }

    function openScenario(sid, role, cat) {
      closeScenario();
      S = { sid, role, cat, filled: false, data: null, rows: new Map(), els: new Map(), catinfo: new Map(),
            sel: role === 'cat' ? cat : null, edit: false, centered: false, unsubs: [] };
      $('back-btn').hidden = role !== 'admin';
      $('rows').querySelectorAll('.srow:not(.shead), .sheet-empty').forEach(el => el.remove());
      show('sheet');
      ensureMap();

      S.unsubs.push(onSnapshot(sref(), snap => {
        if (!snap.exists()) {
          lsSet(SID_KEY, null);
          role === 'admin' ? openAdmin() : show('gate');
          return;
        }
        S.data = snap.data();
        renderAll();
      }, err => { console.error(err); show('gate'); }));

      S.unsubs.push(onSnapshot(collection(db, 'scenarios', sid, 'rows'), snap => {
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') S.rows.delete(ch.doc.id);
          else S.rows.set(ch.doc.id, ch.doc.data());
        });
        // Tukšam scenārijam (vecie projekti) uzreiz 4 tukšas rindas.
        if (!snap.metadata.fromCache && !S.filled) {
          S.filled = true;
          if (snap.empty && canWrite()) {
            const b = writeBatch(db);
            for (let i = 1; i <= 4; i++) b.set(doc(collection(db, 'scenarios', sid, 'rows')), { t: '', ev: '', note: '', cats: [], order: i * 1000 });
            b.commit().catch(fail);
          }
        }
        renderRows();
      }, err => console.error(err)));

      S.unsubs.push(onSnapshot(collection(db, 'scenarios', sid, 'catinfo'), snap => {
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') S.catinfo.delete(ch.doc.id);
          else S.catinfo.set(ch.doc.id, ch.doc.data());
        });
        if (S.data) renderArrive();
      }, err => console.error(err)));
    }

    $('back-btn').addEventListener('click', () => openAdmin());

    function renderAll() {
      const lang = S.data.lang || 'lv';
      document.documentElement.lang = lang;
      document.querySelectorAll('#sheet [data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
      $('cat-name').placeholder = tr('newCat');
      document.querySelectorAll('#tp [data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
      renderVenue();
      renderCats();
      renderRows();
    }

    // ----- Vieta, adrese, karte -----
    function setVal(el, v) { if (document.activeElement !== el && el.value !== (v || '')) el.value = v || ''; }
    function renderVenue() {
      const w = canWrite();
      for (const id of ['v-title', 'v-name', 'v-addr', 'v-desc']) $(id).readOnly = !w;
      setVal($('v-desc'), S.data.desc);
      autosize($('v-desc'));
      for (const [id, f] of [['v-guests', 'guests'], ['v-end', 'end']]) {
        $(id).disabled = !w;
        $(id).textContent = S.data[f] || (w ? '--:--' : '—');
        $(id).classList.toggle('ph', !S.data[f]);
      }
      setVal($('v-city'), S.data.city);
      $('v-city').readOnly = !w;
      $('v-city').placeholder = w ? tr('city') : '';
      setVal($('v-title'), S.data.title);
      $('v-title').placeholder = w ? tr('title') : '';
      setVal($('v-name'), S.data.place);
      setVal($('v-addr'), S.data.address);
      $('v-find').hidden = !w;
      $('v-name').placeholder = w ? tr('venue') : '';
      $('v-addr').placeholder = w ? tr('address') : '';
      renderMarker();
    }
    $('v-desc').addEventListener('input', e => {
      autosize(e.target);
      later('desc', () => updateDoc(sref(), { desc: e.target.value, updatedAt: serverTimestamp() }).catch(fail));
    });
    // Viesi ierodas – līdz cikiem (beigu laikam sava uzraksta nav).
    for (const [id, f] of [['v-guests', 'guests'], ['v-end', 'end']]) {
      $(id).addEventListener('click', e => {
        e.stopPropagation();
        openTp({
          key: f,
          get: () => S.data[f],
          set: v => { S.data[f] = v; renderVenue(); updateDoc(sref(), { [f]: v, updatedAt: serverTimestamp() }).catch(fail); },
          hint: () => empty
        }, $(id).parentElement);
      });
    }
    $('v-city').addEventListener('input', e => later('city', () =>
      updateDoc(sref(), { city: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));
    $('v-title').addEventListener('input', e => later('title', () =>
      updateDoc(sref(), { title: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));
    $('v-name').addEventListener('input', e => later('place', () =>
      updateDoc(sref(), { place: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));
    $('v-addr').addEventListener('input', e => later('address', () =>
      updateDoc(sref(), { address: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));

    function ensureMap() {
      if (map || !window.L) { map && setTimeout(() => map.invalidateSize(), 50); return; }
      map = L.map('map', { scrollWheelZoom: false });
      showLatvia();
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);
      map.on('click', e => {
        if (!canWrite()) return;
        updateDoc(sref(), { lat: e.latlng.lat, lng: e.latlng.lng, updatedAt: serverTimestamp() }).catch(fail);
      });
    }
    // Karte vienmēr rāda visu Latviju; pietuvināt katrs var pats.
    function showLatvia() { map.fitBounds([[55.67, 20.97], [58.08, 28.24]]); }
    function renderMarker() {
      if (!map) return;
      const { lat, lng } = S.data;
      if (lat == null || lng == null) {
        if (marker) { marker.remove(); marker = null; }
        if (!S.centered) { showLatvia(); S.centered = true; }
        return;
      }
      if (!marker) marker = L.circleMarker([lat, lng], { radius: 9, color: '#fff', weight: 2.5, fillColor: '#B07320', fillOpacity: 1 }).addTo(map);
      else marker.setLatLng([lat, lng]);
      if (!S.centered) { showLatvia(); S.centered = true; }
    }
    $('v-find').addEventListener('click', async () => {
      const addr = $('v-addr').value.trim(), city = $('v-city').value.trim();
      const q = [addr, city].filter(Boolean).join(', ');
      if (!q) return;
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=lv&q=' + encodeURIComponent(q));
        const [hit] = await res.json();
        if (!hit) { toast(tr('notFound')); return; }
        const lat = +hit.lat, lng = +hit.lon;
        await updateDoc(sref(), { address: addr, city, lat, lng, updatedAt: serverTimestamp() });
      } catch (e) { fail(e); }
    });

    // ----- Kategorijas -----
    function renderCats() {
      const box = $('cat-list');
      box.replaceChildren();
      const cats = S.data.cats || [];
      if (S.sel && !cats.some(c => c.id === S.sel)) S.sel = null;
      for (const c of cats) {
        const n = [...S.rows.values()].filter(r => (r.cats || []).includes(c.id)).length;
        const wrap = document.createElement('div');
        wrap.className = 'cat' + (S.sel === c.id ? ' sel' : '');
        const b = document.createElement('button'); b.className = 'cat-btn'; b.type = 'button';
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = c.name;
        const cnt = document.createElement('span'); cnt.className = 'n'; cnt.textContent = n || '';
        b.append(nm, cnt);
        b.addEventListener('click', () => { S.sel = S.sel === c.id ? null : c.id; renderCats(); renderRows(); });
        wrap.append(b);
        // Dzēst var tikai "Labot" režīmā.
        if (S.edit && canWrite()) {
          const x = document.createElement('button'); x.className = 'cat-x'; x.type = 'button'; x.textContent = '×';
          x.addEventListener('click', e => { e.stopPropagation(); askConfirm(wrap, tr('delCat'), () => deleteCat(c.id)); });
          wrap.append(x);
        }
        box.append(wrap);
      }
      $('cat-add').hidden = !canWrite();
      $('edit-btn').hidden = !canWrite();
      $('edit-btn').textContent = S.edit ? tr('done') : tr('edit');
      $('add-row').hidden = !canWrite();
    }

    $('cat-add').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('cat-name').value.trim();
      if (!name) return;
      const id = slug(name) + '-' + Math.random().toString(36).slice(2, 6);
      $('cat-name').value = '';
      updateDoc(sref(), { cats: [...(S.data.cats || []), { id, name }], updatedAt: serverTimestamp() }).catch(fail);
    });

    async function deleteCat(id) {
      try {
        await updateDoc(sref(), { cats: (S.data.cats || []).filter(c => c.id !== id), updatedAt: serverTimestamp() });
        const b = writeBatch(db);
        for (const [rid, r] of S.rows) if ((r.cats || []).includes(id)) b.update(rref(rid), { cats: arrayRemove(id) });
        await b.commit();
      } catch (e) { fail(e); }
    }

    $('edit-btn').addEventListener('click', () => { S.edit = !S.edit; renderCats(); renderRows(); });

    // ----- Rindas -----
    // Rindas lauki: t, ev, note, cats[], order, catNotes { catId: teksts }, marks { catId: ['t','ev','note','cn'] }.
    function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    window.addEventListener('resize', () => document.querySelectorAll('#rows textarea, #arr-note, #v-desc').forEach(autosize));
    const empty = { h: '', m: '' };

    function makeRow(id) {
      const el = document.createElement('div');
      el.className = 'srow';
      const paint = f => `<button class="paint" type="button" data-f="${f}"></button>`;
      el.innerHTML = '<button class="mark" type="button"><span></span></button>'
        + '<div class="cw w-t"><button class="cell c-time" type="button"></button>' + paint('t') + '</div>'
        + '<div class="cw w-ev"><textarea class="cell" rows="1" maxlength="2000"></textarea>' + paint('ev') + '</div>'
        + '<div class="cw w-note"><textarea class="cell c-note" rows="1" maxlength="2000"></textarea>' + paint('note') + '</div>'
        + '<div class="cw w-cn"><textarea class="cell c-cn" rows="1" maxlength="2000"></textarea>' + paint('cn') + '</div>'
        + '<div class="r-act"><button class="ins" type="button">+</button><button class="del" type="button">×</button></div>';
      const q = sel => el.querySelector(sel);
      const [time, ev, note, cn] = [q('.c-time'), q('.w-ev textarea'), q('.c-note'), q('.c-cn')];
      const bind = (input, field) => input.addEventListener('input', () => {
        autosize(input);
        later(id + field, () => updateDoc(rref(id), { [field]: input.value }).catch(fail));
      });
      bind(ev, 'ev'); bind(note, 'note');
      // Kategorijas komentārs: saglabā tai kategorijai, kas bija izvēlēta rakstīšanas brīdī.
      cn.addEventListener('input', () => {
        autosize(cn);
        const cat = S.sel;
        if (!cat) return;
        later(id + 'cn' + cat, () => updateDoc(rref(id), { ['catNotes.' + cat]: cn.value }).catch(fail));
      });
      time.addEventListener('click', e => {
        e.stopPropagation();
        openTp({
          key: 'r:' + id,
          get: () => S.rows.get(id)?.t,
          set: v => { const r = S.rows.get(id); if (!r) return; r.t = v; renderRows(); updateDoc(rref(id), { t: v }).catch(fail); },
          hint: () => {
            const list = sortedRows();
            for (let i = list.findIndex(([rid]) => rid === id) - 1; i >= 0; i--) if (list[i][1].t) return split(list[i][1].t);
            return empty;
          }
        }, q('.w-t'));
      });
      q('.mark').addEventListener('click', () => {
        const r = S.rows.get(id);
        if (!r || !S.sel) return;
        const on = (r.cats || []).includes(S.sel);
        updateDoc(rref(id), { cats: on ? arrayRemove(S.sel) : arrayUnion(S.sel) }).catch(fail);
      });
      // Iekrāso vienu šūnu izvēlētajai kategorijai (rinda pati tiek pievienota kategorijai).
      el.querySelectorAll('.paint').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const r = S.rows.get(id), cat = S.sel, f = b.dataset.f;
        if (!r || !cat) return;
        const on = (r.marks?.[cat] || []).includes(f);
        const upd = { ['marks.' + cat]: on ? arrayRemove(f) : arrayUnion(f) };
        if (!on && !(r.cats || []).includes(cat)) upd.cats = arrayUnion(cat);
        updateDoc(rref(id), upd).catch(fail);
      }));
      q('.del').addEventListener('click', e => {
        e.stopPropagation();
        askConfirm(el, tr('delRow'), () => deleteDoc(rref(id)).catch(fail));
      });
      q('.ins').addEventListener('click', () => insertAfter(id));
      el._f = { time, ev, note, cn, mark: q('.mark'), del: q('.del'), ins: q('.ins'),
                cells: { t: q('.w-t'), ev: q('.w-ev'), note: q('.w-note'), cn: q('.w-cn') } };
      return el;
    }

    const sortedRows = () => [...S.rows.entries()].sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
    const canCat = cat => canWrite() || (S.role === 'cat' && S.cat === cat);
    const catName = id => (S.data.cats || []).find(c => c.id === id)?.name || '';

    // Jauna tukša rinda tieši zem norādītās.
    async function insertAfter(id) {
      const list = sortedRows();
      const i = list.findIndex(([rid]) => rid === id);
      const cur = list[i][1].order || 0;
      const next = list[i + 1] ? (list[i + 1][1].order || 0) : cur + 2000;
      try {
        const ref = await addDoc(collection(db, 'scenarios', S.sid, 'rows'), {
          t: '', ev: '', note: '', cats: S.sel ? [S.sel] : [], order: (cur + next) / 2
        });
        pendingFocus = ref.id;
        renderRows();
      } catch (e) { fail(e); }
    }

    // Mazs "Izdzēst? Jā / Nē" logs pie elementa.
    let cfmEl = null;
    function closeConfirm() { cfmEl?.remove(); cfmEl = null; }
    function askConfirm(anchor, text, onYes) {
      closeConfirm();
      const box = document.createElement('div'); box.className = 'cfm';
      const t = document.createElement('span'); t.textContent = text;
      const yes = document.createElement('button'); yes.type = 'button'; yes.className = 'yes'; yes.textContent = tr('yes');
      const no = document.createElement('button'); no.type = 'button'; no.className = 'no'; no.textContent = tr('no');
      yes.addEventListener('click', () => { closeConfirm(); onYes(); });
      no.addEventListener('click', closeConfirm);
      box.addEventListener('click', e => e.stopPropagation());
      box.append(t, yes, no);
      anchor.append(box);
      cfmEl = box;
    }
    document.addEventListener('click', closeConfirm);

    let pendingFocus = null;
    function renderRows() {
      if (!S || !S.data) return;
      const box = $('rows');
      const list = sortedRows();
      const sel = S.sel;
      box.classList.toggle('withcat', !!sel);
      box.classList.toggle('paintable', !!sel && canWrite());
      $('h-cn').textContent = sel ? tr('note') + ' · ' + catName(sel) : '';

      for (const [id, el] of S.els) if (!S.rows.has(id)) { el.remove(); S.els.delete(id); }
      box.querySelector('.sheet-empty')?.remove();
      if (!list.length) {
        const p = document.createElement('div'); p.className = 'sheet-empty'; p.textContent = tr('empty');
        box.append(p);
      }

      list.forEach(([id, r], i) => {
        let el = S.els.get(id);
        if (!el) { el = makeRow(id); S.els.set(id, el); }
        const f = el._f;
        const editable = canRow(r);
        for (const [input, v] of [[f.ev, r.ev], [f.note, r.note]]) {
          input.readOnly = !editable;
          setVal(input, v);
        }
        f.cn.readOnly = !(sel && canCat(sel));
        setVal(f.cn, sel ? r.catNotes?.[sel] : '');
        f.time.disabled = !editable;
        f.time.textContent = r.t || (editable ? '--:--' : '');
        f.time.classList.toggle('ph', !r.t);
        const cats = r.cats || [];
        const painted = sel ? (r.marks?.[sel] || []) : [];
        for (const [k, cell] of Object.entries(f.cells)) cell.classList.toggle('painted', painted.includes(k));
        f.mark.disabled = !(sel && canWrite());
        f.mark.classList.toggle('on', !!sel && cats.includes(sel));
        f.del.disabled = !(S.edit && canWrite());
        f.ins.disabled = !canWrite();
        el.classList.toggle('hl', !!sel && cats.includes(sel));
        el.classList.toggle('dim', !!sel && !cats.includes(sel));
        // Kārtība: pārvieto tikai, ja rinda nav savā vietā (lai nepazūd fokuss).
        const at = box.children[i + 1];
        if (at !== el) box.insertBefore(el, at || null);
      });
      requestAnimationFrame(() => box.querySelectorAll('textarea').forEach(autosize));
      if (pendingFocus && S.els.has(pendingFocus)) { S.els.get(pendingFocus)._f.ev.focus(); pendingFocus = null; }
      renderCatCounts();
      renderArrive();
    }
    function renderCatCounts() {
      const cats = S.data.cats || [];
      $('cat-list').querySelectorAll('.cat').forEach((wrap, i) => {
        const c = cats[i]; if (!c) return;
        const n = [...S.rows.values()].filter(r => (r.cats || []).includes(c.id)).length;
        wrap.querySelector('.n').textContent = n || '';
      });
    }

    // ----- Kategorijas ierašanās laiks + komentārs (virs tabulas) -----
    // catinfo/{catId}: { arrive, note }
    const ciref = cat => doc(db, 'scenarios', S.sid, 'catinfo', cat);
    function renderArrive() {
      const sel = S.sel;
      $('arrive').hidden = !sel;
      if (!sel) return;
      const info = S.catinfo.get(sel) || {};
      const w = canCat(sel);
      $('arrive-title').textContent = catName(sel);
      $('arr-t').disabled = !w;
      $('arr-t').textContent = info.arrive || (w ? '--:--' : '—');
      $('arr-t').classList.toggle('ph', !info.arrive);
      $('arr-note').readOnly = !w;
      if ($('arr-note').dataset.cat !== sel) { $('arr-note').dataset.cat = sel; $('arr-note').value = ''; }
      setVal($('arr-note'), info.note);
      autosize($('arr-note'));
    }
    $('arr-note').addEventListener('input', e => {
      autosize(e.target);
      const cat = S.sel;
      if (!cat) return;
      later('arr' + cat, () => setDoc(ciref(cat), { note: e.target.value }, { merge: true }).catch(fail));
    });
    $('arr-t').addEventListener('click', e => {
      e.stopPropagation();
      const cat = S.sel;
      if (!cat) return;
      openTp({
        key: 'a:' + cat,
        get: () => S.catinfo.get(cat)?.arrive,
        set: v => {
          S.catinfo.set(cat, { ...(S.catinfo.get(cat) || {}), arrive: v });
          renderArrive();
          setDoc(ciref(cat), { arrive: v }, { merge: true }).catch(fail);
        },
        hint: () => empty
      }, $('arr-t').parentElement);
    });

    // ----- Laika izvēle: stundas un minūtes ar klikšķi, bez rakstīšanas -----
    // Mērķis: { key, get(), set(v), hint() } — rindas laiks vai kategorijas ierašanās laiks.
    const tp = $('tp');
    let tpT = null;
    const pad = n => String(n).padStart(2, '0');
    for (let h = 0; h < 24; h++) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = pad(h); b.dataset.h = pad(h);
      $('tp-h').append(b);
    }
    for (let m = 0; m < 60; m += 5) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = pad(m); b.dataset.m = pad(m);
      $('tp-m').append(b);
    }
    const split = t => { const [h, m] = (t || '').split(':'); return { h: h || '', m: m || '' }; };
    const tpValue = () => split(tpT?.get());
    // Tukšam laikam iekrāso ieteikumu (rindām — iepriekšējās rindas laiku).
    const tpHint = () => (!tpT || tpT.get()) ? empty : tpT.hint();
    function tpMark() {
      const { h, m } = tpValue();
      const hint = tpHint();
      tp.querySelectorAll('[data-h]').forEach(b => {
        b.classList.toggle('on', b.dataset.h === h);
        b.classList.toggle('hint', b.dataset.h === hint.h);
      });
      tp.querySelectorAll('[data-m]').forEach(b => {
        b.classList.toggle('on', b.dataset.m === m);
        b.classList.toggle('hint', b.dataset.m === hint.m);
      });
    }
    function openTp(target, anchor) {
      if (tpT?.key === target.key) { closeTp(); return; }
      tpT = target;
      anchor.append(tp);
      tp.hidden = false;
      tpMark();
    }
    function closeTp() { tp.hidden = true; tpT = null; }
    function setTime(v, close) {
      if (!tpT) return;
      tpT.set(v);
      tpMark();
      if (close) closeTp();
    }
    tp.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('button');
      if (!b) return;
      const cur = tpValue(), hint = tpHint();
      const h = cur.h || hint.h, m = cur.m || hint.m;
      if (b.dataset.h) setTime(b.dataset.h + ':' + (m || '00'), false);
      else if (b.dataset.m) setTime((h || '00') + ':' + b.dataset.m, true);
      else if (b.id === 'tp-clear') setTime('', true);
    });
    document.addEventListener('click', () => { if (!tp.hidden) closeTp(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !tp.hidden) closeTp(); });

    $('add-row').addEventListener('click', async () => {
      const last = Math.max(0, ...[...S.rows.values()].map(r => r.order || 0));
      try {
        const ref = await addDoc(collection(db, 'scenarios', S.sid, 'rows'), {
          t: '', ev: '', note: '', cats: S.sel ? [S.sel] : [], order: last + 1000
        });
        pendingFocus = ref.id;
        renderRows();
      } catch (e) { fail(e); }
    });

    // ---------- Admin: saraksts ----------
    // keys/main: { rw, ro, cats: { <kategorijas id>: parole } }
    const keysCache = new Map();
    let allProjects = [];
    let viewHist = false;

    // Visas projekta paroles kā [atslēga, parole, rādītāja dati].
    function entries(keys) {
      const out = [];
      if (keys.rw) out.push(['rw', keys.rw, { role: 'rw' }]);
      if (keys.ro) out.push(['ro', keys.ro, { role: 'ro' }]);
      for (const [c, pw] of Object.entries(keys.cats || {})) if (pw) out.push(['c:' + c, pw, { role: 'cat', cat: c }]);
      return out;
    }

    // Vecais formāts { rw, ro, dj } → DJ parole kļūst par DJ kategorijas paroli.
    async function migrateKeys(p, keys) {
      if (typeof keys.dj !== 'string') return keys;
      const next = { rw: keys.rw || '', ro: keys.ro || '', cats: { ...(keys.cats || {}), dj: keys.dj } };
      const b = writeBatch(db);
      b.set(doc(db, 'scenarios', p.id, 'keys', 'main'), next);
      const h = await indexId(keys.dj);
      b.delete(doc(db, 'scnIndex', h));
      await b.commit();
      // Atsevišķi: dzēst + izveidot vienā partijā noteikumi redzētu kā aizliegtu "update".
      if (!p.archived) await setDoc(doc(db, 'scnIndex', h), { sid: p.id, role: 'cat', cat: 'dj' });
      return next;
    }

    function openAdmin() {
      closeScenario();
      show('admin');
      if (unsubProjects) { renderProjects(); return; }
      unsubProjects = onSnapshot(query(collection(db, 'scenarios'), orderBy('createdAt', 'desc')), async snap => {
        allProjects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await Promise.all(allProjects.filter(p => !keysCache.has(p.id)).map(async p => {
          try {
            const k = (await getDoc(doc(db, 'scenarios', p.id, 'keys', 'main'))).data() || {};
            keysCache.set(p.id, await migrateKeys(p, k));
          } catch (e) { console.error(e); keysCache.set(p.id, {}); }
        }));
        renderProjects();
      }, err => { console.error(err); toast('Neizdevās ielādēt projektus'); });
    }

    $('hist-btn').addEventListener('click', () => { viewHist = !viewHist; renderProjects(); });

    function renderProjects() {
      const active = allProjects.filter(p => !p.archived);
      const hist = allProjects.filter(p => p.archived)
        .sort((a, b) => (b.archivedAt?.toMillis?.() || 0) - (a.archivedAt?.toMillis?.() || 0));
      const list = viewHist ? hist : active;

      $('admin-title').textContent = viewHist ? 'Vēsture' : 'Projekti';
      $('new-btn').hidden = viewHist;
      $('hist-btn').textContent = viewHist ? '← Aktuālie projekti' : `Vēsture (${hist.length})`;
      $('projects-empty').textContent = viewHist ? 'Vēsturē vēl nav neviena projekta.' : 'Vēl nav neviena projekta.';
      $('projects-empty').hidden = list.length > 0;

      const box = $('projects');
      box.replaceChildren();
      for (const p of list) {
        const keys = keysCache.get(p.id) || {};
        const card = document.createElement('article');
        card.className = 'proj' + (p.archived ? ' arch' : '');

        const top = document.createElement('div'); top.className = 'proj-top';
        const h = document.createElement('h2'); h.textContent = p.name;
        const lang = document.createElement('span'); lang.className = 'lang'; lang.textContent = p.lang || 'lv';
        top.append(h, lang);

        const pwList = document.createElement('div'); pwList.className = 'pw-list';
        for (const r of ['rw', 'ro']) {
          const row = document.createElement('div'); row.className = 'pw';
          const l = document.createElement('span'); l.className = 'pw-label'; l.textContent = ROLE_LABEL[r];
          const v = document.createElement('button'); v.className = 'pw-val'; v.type = 'button';
          v.textContent = keys[r] || '—'; v.title = 'Kopēt';
          v.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(keys[r] || ''); toast('Parole nokopēta'); } catch {}
          });
          row.append(l, v);
          pwList.append(row);
        }

        const actions = document.createElement('div'); actions.className = 'proj-actions';
        const edit = document.createElement('button'); edit.className = 'btn btn-line btn-sm'; edit.textContent = 'Labot';
        edit.addEventListener('click', () => openModal(p));
        const open = document.createElement('button'); open.className = 'btn btn-dark btn-sm'; open.textContent = 'Atvērt';
        open.addEventListener('click', () => openScenario(p.id, 'admin'));
        actions.append(edit, open);

        card.append(top, pwList, actions);
        box.append(card);
      }
    }

    // ---------- Admin: projekta forma ----------
    let editing = null; // null = jauns projekts
    const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 20) || 'projekts';
    function genPw() {
      const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
      const rnd = crypto.getRandomValues(new Uint8Array(4));
      return slug($('f-name').value) + '-' + [...rnd].map(n => abc[n % abc.length]).join('');
    }
    $('proj-form').addEventListener('click', e => {
      const b = e.target.closest('[data-gen]');
      if (b) b.previousElementSibling.value = genPw();
    });

    function modalCats() {
      return editing ? (editing.cats || []) : (DEFAULT_CATS[$('f-lang').value] || DEFAULT_CATS.lv);
    }
    function renderModalCats(values) {
      const box = $('f-cats');
      box.replaceChildren();
      for (const c of modalCats()) {
        const l = document.createElement('label'); l.textContent = 'Parole: ' + c.name;
        const row = document.createElement('div'); row.className = 'row';
        const inp = document.createElement('input'); inp.className = 'field'; inp.maxLength = 60; inp.dataset.cat = c.id;
        inp.value = values[c.id] || '';
        const g = document.createElement('button'); g.type = 'button'; g.className = 'btn btn-line btn-sm';
        g.dataset.gen = ''; g.textContent = 'Ģenerēt';
        row.append(inp, g);
        box.append(l, row);
      }
    }
    const modalCatValues = () => Object.fromEntries(
      [...$('f-cats').querySelectorAll('input[data-cat]')].map(i => [i.dataset.cat, norm(i.value)]));
    $('f-lang').addEventListener('change', () => { if (!editing) renderModalCats(modalCatValues()); });

    function openModal(p) {
      editing = p;
      $('modal-title').textContent = p ? 'Labot projektu' : 'Jauns projekts';
      $('f-name').value = p ? p.name : '';
      $('f-lang').value = p ? (p.lang || 'lv') : 'lv';
      const keys = p ? (keysCache.get(p.id) || {}) : {};
      $('f-rw').value = keys.rw || '';
      $('f-ro').value = keys.ro || '';
      renderModalCats(keys.cats || {});
      $('modal-msg').textContent = '';
      $('danger').hidden = !p;
      $('arch-btn').textContent = p?.archived ? 'Pārnest uz aktuālajiem' : 'Pārnest uz vēsturi';
      $('modal').hidden = false;
      $('f-name').focus();
    }
    function closeModal() { $('modal').hidden = true; editing = null; }
    $('new-btn').addEventListener('click', () => openModal(null));
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

    // Izmet tos, kas ienāca ar paroli, kura vairs neder.
    async function kickMembers(sid, keyNames) {
      if (!keyNames.length) return;
      const ms = await getDocs(collection(db, 'scenarios', sid, 'members'));
      await Promise.all(ms.docs.filter(m => {
        const d = m.data();
        return keyNames.includes(d.role === 'cat' ? 'c:' + d.cat : d.role);
      }).map(m => deleteDoc(m.ref)));
    }

    $('proj-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = $('f-name').value.trim();
      const lang = $('f-lang').value;
      const catVals = Object.fromEntries(Object.entries(modalCatValues()).filter(([, v]) => v));
      const keys = { rw: norm($('f-rw').value), ro: norm($('f-ro').value), cats: catVals };
      const err = t => { $('modal-msg').textContent = t; };

      if (!name) return err('Ieraksti nosaukumu.');
      if (!keys.rw || !keys.ro) return err('Aizpildi abas paroles.');
      const next = entries(keys);
      if (new Set(next.map(x => x[1])).size < next.length) return err('Visām parolēm jābūt atšķirīgām.');
      if (next.some(x => x[1] === 'pasmaidi')) return err('Šī parole ir rezervēta.');

      const archived = !!editing?.archived;
      const prev = editing ? entries(keysCache.get(editing.id) || {}) : [];
      const prevMap = new Map(prev.map(x => [x[0], x[1]]));
      const nextMap = new Map(next.map(x => [x[0], x[1]]));
      const added = next.filter(x => prevMap.get(x[0]) !== x[1]);
      const removed = prev.filter(x => nextMap.get(x[0]) !== x[1]);

      $('modal-save').disabled = true;
      try {
        // Parolei jābūt unikālai visos projektos.
        const ownOld = new Set(prev.map(x => x[1]));
        for (const x of added) {
          if (ownOld.has(x[1])) continue;
          if ((await getDoc(doc(db, 'scnIndex', await indexId(x[1])))).exists())
            return err(`Parole "${x[1]}" jau ir aizņemta citā projektā.`);
        }

        const sid = editing ? editing.id : doc(collection(db, 'scenarios')).id;
        const b = writeBatch(db);
        if (editing) {
          b.update(doc(db, 'scenarios', sid), { name, lang, updatedAt: serverTimestamp() });
        } else {
          b.set(doc(db, 'scenarios', sid), {
            name, lang, place: '', address: '', lat: null, lng: null, cats: modalCats(), archived: false,
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
          // Jaunam scenārijam uzreiz 4 tukšas rindas.
          for (let i = 1; i <= 4; i++) {
            b.set(doc(collection(db, 'scenarios', sid, 'rows')), { t: '', ev: '', note: '', cats: [], order: i * 1000 });
          }
        }
        b.set(doc(db, 'scenarios', sid, 'keys', 'main'), keys);
        // Vēsturē esošam projektam paroļu rādītāju nav — tos izveido, pārnesot atpakaļ.
        if (!archived) for (const x of removed) b.delete(doc(db, 'scnIndex', await indexId(x[1])));
        await b.commit();
        // Jaunie rādītāji atsevišķi (parole var būt pārcelta no vienas lomas uz citu).
        if (!archived && added.length) {
          const b2 = writeBatch(db);
          for (const x of added) b2.set(doc(db, 'scnIndex', await indexId(x[1])), { sid, ...x[2] });
          await b2.commit();
        }
        if (editing) await kickMembers(sid, removed.map(x => x[0]));
        keysCache.set(sid, keys);
        const wasEditing = !!editing;
        closeModal();
        renderProjects();
        toast(wasEditing ? 'Saglabāts' : 'Projekts izveidots');
      } catch (ex) {
        console.error(ex);
        err('Neizdevās saglabāt.');
      } finally {
        $('modal-save').disabled = false;
      }
    });

    // ---------- Admin: vēsture ----------
    // Uz vēsturi: paroles pārstāj strādāt, visi klienti tiek izmesti. Atpakaļ: paroles atkal strādā.
    $('arch-btn').addEventListener('click', async () => {
      if (!editing) return;
      const p = editing;
      const on = !p.archived;
      const list = entries(keysCache.get(p.id) || {});
      $('arch-btn').disabled = true;
      try {
        if (!on) {
          for (const x of list) {
            if ((await getDoc(doc(db, 'scnIndex', await indexId(x[1])))).exists()) {
              $('modal-msg').textContent = `Parole "${x[1]}" jau ir aizņemta citā projektā. Nomaini to un mēģini vēlreiz.`;
              return;
            }
          }
        }
        const b = writeBatch(db);
        b.update(doc(db, 'scenarios', p.id), { archived: on, archivedAt: on ? serverTimestamp() : null });
        for (const x of list) {
          const ref = doc(db, 'scnIndex', await indexId(x[1]));
          on ? b.delete(ref) : b.set(ref, { sid: p.id, ...x[2] });
        }
        await b.commit();
        if (on) {
          const ms = await getDocs(collection(db, 'scenarios', p.id, 'members'));
          await Promise.all(ms.docs.map(m => deleteDoc(m.ref)));
        }
        closeModal();
        toast(on ? 'Pārnests uz vēsturi' : 'Pārnests uz aktuālajiem');
      } catch (ex) {
        console.error(ex);
        $('modal-msg').textContent = 'Neizdevās pārnest.';
      } finally {
        $('arch-btn').disabled = false;
      }
    });
  </script>
</body>
</html>
