<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Roadchanger scenārijs</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; zoom: 0.9; min-height: 100vh; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    button:disabled { opacity: 0.55; cursor: default; }

    /* ---------- Paroles logs ---------- */
    .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card {
      width: 100%; max-width: 26rem; background: #FFFBF5;
      border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07);
      padding: clamp(1.75rem, 4vw, 2.5rem); text-align: center;
    }
    .card-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2C2416; text-decoration: none; }
    .card h1 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.6rem; font-weight: 400; margin: 1.25rem 0 1.5rem; }
    .login-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .field { width: 100%; padding: 0.75rem 0.9rem; border: 0.5px solid #E0CCA4; border-radius: 8px; background: #fff; font-size: 0.95rem; }
    .field:focus { outline: none; border-color: #B07320; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.9rem; letter-spacing: 0.04em; }
    .btn-dark { background: #2C2416; color: #F5ECD8; }
    .btn-dark:hover { background: #3D3020; }
    .btn-brown { background: #B07320; color: #fff; }
    .btn-brown:hover { background: #9A6418; }
    .btn-line { border: 0.5px solid #E0CCA4; background: #fff; }
    .btn-line:hover { border-color: #B07320; }
    .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.82rem; }
    .msg { margin-top: 1rem; font-size: 0.9rem; color: #6B5035; min-height: 1.2em; }
    .msg.err { color: #A33A2A; }

    /* ---------- Navigācija ---------- */
    .topnav {
      display: flex; align-items: center; gap: clamp(1rem, 3vw, 2.5rem);
      padding: 1.1rem 3rem; background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8; position: sticky; top: 0; z-index: 50;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-title { font-size: 14px; letter-spacing: 0.05em; color: #8A6840; }
    .nav-user { margin-left: auto; font-size: 13px; color: #8A6840; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Admin: projektu saraksts ---------- */
    .wrap { padding: 2.5rem 3rem 4rem; max-width: 72rem; margin: 0 auto; }
    .wrap-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.75rem; }
    .wrap-head h1 { font-family: 'Libre Baskerville', Georgia, serif; font-size: clamp(1.4rem, 2.2vw, 1.8rem); font-weight: 400; }
    .wrap-head .btn { margin-left: auto; }
    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1.25rem; }
    .empty { color: #7A5C38; font-size: 0.95rem; }
    .proj {
      background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); padding: 1.3rem 1.4rem;
      display: flex; flex-direction: column; gap: 0.9rem;
    }
    .proj-top { display: flex; align-items: baseline; gap: 0.75rem; }
    .proj h2 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.15rem; font-weight: 400; overflow-wrap: anywhere; }
    .lang { margin-left: auto; flex: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: #B07320; border: 0.5px solid #E0CCA4; border-radius: 4px; padding: 0.1rem 0.4rem; }
    .pw-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .pw { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; }
    .pw-label { flex: none; width: 8.5rem; color: #7A5C38; }
    .pw-val {
      flex: 1; min-width: 0; text-align: left; font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
      background: #FEF9F2; border: 0.5px solid #EAD9B8; border-radius: 6px; padding: 0.3rem 0.55rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pw-val:hover { border-color: #B07320; }
    .proj-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* ---------- Modālais logs ---------- */
    .scrim { position: fixed; inset: 0; background: rgba(44, 36, 22, 0.35); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 1rem; overflow-y: auto; }
    .modal {
      width: 100%; max-width: 30rem; background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px;
      box-shadow: 0 12px 36px rgba(44, 36, 22, 0.18); padding: 1.6rem;
    }
    .modal h2 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.3rem; font-weight: 400; margin-bottom: 1.25rem; }
    .modal label { display: block; font-size: 0.8rem; letter-spacing: 0.04em; color: #7A5C38; margin: 0.9rem 0 0.35rem; }
    .modal .row { display: flex; gap: 0.5rem; }
    .modal .row .field { flex: 1; min-width: 0; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
    .danger-zone { margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid #EAD9B8; }
    .danger-link { font-size: 0.82rem; color: #A33A2A; text-decoration: underline; text-underline-offset: 3px; }
    .btn-danger { background: #A33A2A; color: #fff; }

    .nav-back { font-size: 14px; letter-spacing: 0.05em; color: #8A6840; }
    .nav-back:hover { color: #B07320; }

    /* ---------- Scenārijs ---------- */
    .sheet-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(14rem, 19vw, 17rem); gap: 1.75rem; padding: 2rem 3rem 4rem; align-items: start; }
    .venue { display: grid; grid-template-columns: minmax(0, 1fr) clamp(16rem, 30vw, 24rem); gap: 1.5rem; margin-bottom: 2rem; align-items: start; }
    .venue-text { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
    .venue-label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5C38; }
    .plain { width: 100%; border: 0.5px solid transparent; border-radius: 6px; background: transparent; padding: 0.3rem 0.45rem; margin-left: -0.45rem; }
    .plain:not([readonly]):hover { border-color: #EAD9B8; background: #fff; }
    .plain:not([readonly]):focus { outline: none; border-color: #B07320; background: #fff; }
    .plain[readonly] { cursor: default; }
    .venue-name { font-family: 'Libre Baskerville', Georgia, serif; font-size: clamp(1.5rem, 2.4vw, 2rem); }
    .venue-addr { font-size: 1rem; color: #6B5035; }
    .addr-row { display: flex; gap: 0.5rem; align-items: center; }
    .addr-row .plain { flex: 1; min-width: 0; }
    #map { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; border: 0.5px solid #E0CCA4; background: #FEF9F2; z-index: 0; }

    .toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .toolbar .spacer { flex: 1; }

    .sheet { background: #fff; border: 0.5px solid #E0CCA4; border-radius: 10px; box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); overflow: hidden; }
    .srow { display: grid; grid-template-columns: 2.25rem 7.5rem minmax(0, 1.2fr) minmax(0, 1fr) 2.25rem; border-bottom: 0.5px solid #EAD9B8; transition: opacity 0.15s, background 0.15s; }
    .srow:last-child { border-bottom: none; }
    .srow > * { min-width: 0; }
    .shead { background: #FEF9F2; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5C38; }
    .shead > div { padding: 0.65rem 0.6rem; }
    .cell { width: 100%; border: none; background: transparent; padding: 0.65rem 0.6rem; font-size: 0.95rem; line-height: 1.45; resize: none; overflow: hidden; display: block; }
    .cell:focus { outline: none; background: #FFFBF5; box-shadow: inset 0 0 0 1.5px #B07320; }
    .cell[readonly] { cursor: default; }
    .cell[readonly]:focus { background: transparent; box-shadow: none; }
    .c-time { font-variant-numeric: tabular-nums; font-weight: 700; }
    .c-note { color: #6B5035; border-left: 0.5px solid #F2E6CF; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0 0.6rem 0.55rem; }
    .tags:empty { display: none; }
    .tag { font-size: 0.7rem; letter-spacing: 0.03em; padding: 0.1rem 0.45rem; border-radius: 999px; background: #FBE7CC; color: #8A5410; }
    .mark, .del { display: flex; align-items: flex-start; justify-content: center; padding-top: 0.75rem; color: #C4A06A; }
    .mark span { width: 1.05rem; height: 1.05rem; border-radius: 50%; border: 1.5px solid #E08A1E; display: block; }
    .mark.on span { background: #E08A1E; }
    .mark:disabled, .del:disabled { visibility: hidden; }
    .del { font-size: 1.1rem; line-height: 1; }
    .del:hover { color: #A33A2A; }
    .srow.hl { background: #FDEBD3; box-shadow: inset 3px 0 0 #E08A1E; }
    .srow.dim { opacity: 0.4; }
    .sheet-empty { padding: 1.25rem; color: #7A5C38; font-size: 0.9rem; }

    .cats { background: #fff; border: 0.5px solid #E0CCA4; border-radius: 12px; box-shadow: 0 4px 18px rgba(44, 36, 22, 0.07); padding: 1.1rem; position: sticky; top: 5.5rem; }
    .cats h3 { font-family: 'Libre Baskerville', Georgia, serif; font-size: 1.05rem; font-weight: 400; margin-bottom: 0.8rem; }
    .cat-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .cat { display: flex; align-items: center; gap: 0.4rem; }
    .cat-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; text-align: left; padding: 0.5rem 0.7rem; border-radius: 8px; border: 0.5px solid #E0CCA4; background: #FFFBF5; font-size: 0.9rem; }
    .cat-btn:hover { border-color: #E08A1E; }
    .cat-btn .n { margin-left: auto; font-size: 0.75rem; color: #7A5C38; }
    .cat-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat.sel .cat-btn { background: #E08A1E; border-color: #E08A1E; color: #fff; }
    .cat.sel .cat-btn .n { color: #fff; }
    .cat-x { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; color: #A33A2A; font-size: 1rem; }
    .cat-x:hover { background: #F6E3DF; }
    .cat-add { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    .cat-add .field { padding: 0.5rem 0.65rem; font-size: 0.88rem; }

    .toast {
      position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 100;
      background: #2C2416; color: #F5ECD8; padding: 0.7rem 1.2rem; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 6px 20px rgba(44, 36, 22, 0.25);
    }

    @media (max-width: 768px) {
      .topnav { padding: 1rem 1.25rem; }
      .wrap { padding: 1.75rem 1.25rem 3rem; }
      .projects { grid-template-columns: minmax(0, 1fr); }
      .pw-label { width: 7rem; }
      .sheet-wrap { grid-template-columns: minmax(0, 1fr); padding: 1.5rem 1.25rem 3rem; gap: 1.25rem; }
      .sheet-wrap aside { order: -1; }
      .venue { grid-template-columns: minmax(0, 1fr); }
      .cats { position: static; }
      .cat-list { flex-direction: row; flex-wrap: wrap; }
      .cat-btn { flex: none; }
      .srow { grid-template-columns: 2.25rem 5.5rem minmax(0, 1fr) 2.25rem; }
      .srow .c-ev { grid-column: 3; }
      .srow .c-note { grid-column: 2 / 4; grid-row: 2; border-left: none; padding-top: 0; }
      .srow .del { grid-column: 4; grid-row: 1; }
      .shead .h-note { display: none; }
    }
  </style>
</head>
<body>

  <!-- Paroles logs -->
  <div class="center-screen" id="gate" hidden>
    <div class="card">
      <a class="card-logo" href="/">Roadchanger</a>
      <h1>Scenārijs</h1>
      <form class="login-form" id="gate-form">
        <input class="field" id="gate-pw" type="password" placeholder="Parole / Password" autocomplete="current-password" required />
        <button class="btn btn-dark" type="submit" id="gate-btn">Ieiet / Enter</button>
      </form>
      <div class="msg" id="gate-msg"></div>
    </div>
  </div>

  <!-- Admin -->
  <div id="admin" hidden>
    <nav class="topnav">
      <a class="nav-logo" href="/">Roadchanger</a>
      <span class="nav-title">Scenāriji · Admin</span>
      <button class="nav-user" data-logout>Iziet</button>
    </nav>
    <main class="wrap">
      <div class="wrap-head">
        <h1>Projekti</h1>
        <button class="btn btn-brown" id="new-btn">+ Jauns projekts</button>
      </div>
      <div class="projects" id="projects"></div>
      <p class="empty" id="projects-empty" hidden>Vēl nav neviena projekta.</p>
    </main>
  </div>

  <!-- Scenārijs (klients un admins) -->
  <div id="sheet" hidden>
    <nav class="topnav">
      <a class="nav-logo" href="/">Roadchanger</a>
      <button class="nav-back" id="back-btn" hidden>← Projekti</button>
      <button class="nav-user" data-logout data-t="logout"></button>
    </nav>
    <div class="sheet-wrap">
      <main>
        <section class="venue">
          <div class="venue-text">
            <span class="venue-label" data-t="venue"></span>
            <input class="plain venue-name" id="v-name" maxlength="200" />
            <span class="venue-label" style="margin-top:0.6rem" data-t="address"></span>
            <div class="addr-row">
              <input class="plain venue-addr" id="v-addr" maxlength="300" />
              <button class="btn btn-line btn-sm" id="v-find" data-t="find"></button>
            </div>
          </div>
          <div id="map"></div>
        </section>

        <div class="toolbar">
          <span class="spacer"></span>
          <button class="btn btn-line btn-sm" id="edit-btn"></button>
        </div>
        <div class="sheet" id="rows">
          <div class="srow shead">
            <div></div><div data-t="time"></div><div data-t="event"></div><div class="h-note" data-t="note"></div><div></div>
          </div>
        </div>
        <div class="toolbar" style="margin-top:0.75rem">
          <button class="btn btn-dark btn-sm" id="add-row" data-t="addRow"></button>
        </div>
      </main>

      <aside class="cats">
        <h3 data-t="cats"></h3>
        <div class="cat-list" id="cat-list"></div>
        <form class="cat-add" id="cat-add">
          <input class="field" id="cat-name" maxlength="40" />
          <button class="btn btn-line btn-sm" type="submit">+</button>
        </form>
      </aside>
    </div>
  </div>

  <!-- Projekta forma -->
  <div class="scrim" id="modal" hidden>
    <form class="modal" id="proj-form">
      <h2 id="modal-title">Jauns projekts</h2>

      <label for="f-name">Nosaukums</label>
      <input class="field" id="f-name" maxlength="120" required />

      <label for="f-lang">Valoda</label>
      <select class="field" id="f-lang">
        <option value="lv">Latviešu</option>
        <option value="en">English</option>
      </select>

      <label for="f-rw">Parole: lasīt / rakstīt</label>
      <div class="row"><input class="field" id="f-rw" maxlength="60" required /><button type="button" class="btn btn-line btn-sm" data-gen="f-rw">Ģenerēt</button></div>

      <label for="f-ro">Parole: tikai lasīt</label>
      <div class="row"><input class="field" id="f-ro" maxlength="60" required /><button type="button" class="btn btn-line btn-sm" data-gen="f-ro">Ģenerēt</button></div>

      <label for="f-dj">Parole: lasīt + DJ</label>
      <div class="row"><input class="field" id="f-dj" maxlength="60" required /><button type="button" class="btn btn-line btn-sm" data-gen="f-dj">Ģenerēt</button></div>

      <div class="msg err" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-line" id="modal-cancel">Atcelt</button>
        <button type="submit" class="btn btn-dark" id="modal-save">Saglabāt</button>
      </div>

      <div class="danger-zone" id="danger" hidden>
        <button type="button" class="danger-link" id="del-show">Dzēst projektu</button>
        <div id="del-confirm" hidden style="margin-top:0.75rem">
          <p style="font-size:0.88rem;color:#6B5035;margin-bottom:0.6rem">Projekts un viss tā saturs tiks izdzēsts neatgriezeniski.</p>
          <button type="button" class="btn btn-danger btn-sm" id="del-yes">Jā, dzēst</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, orderBy,
      onSnapshot, getDocs, writeBatch, serverTimestamp, arrayUnion, arrayRemove
    } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyD7NhjgDjoaaqFHoqdKzbp-k_PI_DYDG4A',
      authDomain: 'roadchanger-kalendars.firebaseapp.com',
      projectId: 'roadchanger-kalendars',
      storageBucket: 'roadchanger-kalendars.firebasestorage.app',
      messagingSenderId: '333346997656',
      appId: '1:333346997656:web:c576e5b8bfdd8aa03497ed'
    });
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ROLES = ['rw', 'ro', 'dj'];
    const ROLE_LABEL = { rw: 'Lasīt / rakstīt', ro: 'Tikai lasīt', dj: 'Lasīt + DJ' };
    const DEFAULT_CATS = {
      lv: [
        { id: 'dj', name: 'DJ' },
        { id: 'vaditajs', name: 'Vadītājs' },
        { id: 'skana', name: 'Skaņa/Gaisma' },
        { id: 'keiterings', name: 'Keiterings' },
        { id: 'dekoracijas', name: 'Dekorācijas' }
      ],
      en: [
        { id: 'dj', name: 'DJ' },
        { id: 'vaditajs', name: 'Host' },
        { id: 'skana', name: 'Sound/Lights' },
        { id: 'keiterings', name: 'Catering' },
        { id: 'dekoracijas', name: 'Decorations' }
      ]
    };
    // Scenārija teksti projekta valodā (valodu izvēlas admins).
    const T = {
      lv: { logout: 'Iziet', venue: 'Vieta', address: 'Adrese', find: 'Atrast kartē', time: 'Laiks', event: 'Notikums',
            note: 'Komentārs', addRow: '+ Rinda', cats: 'Kategorijas', edit: 'Labot', done: 'Gatavs', newCat: 'Jauna kategorija',
            empty: 'Vēl nav nevienas rindas.', notFound: 'Adrese nav atrasta' },
      en: { logout: 'Log out', venue: 'Venue', address: 'Address', find: 'Find on map', time: 'Time', event: 'Event',
            note: 'Comment', addRow: '+ Row', cats: 'Categories', edit: 'Edit', done: 'Done', newCat: 'New category',
            empty: 'No rows yet.', notFound: 'Address not found' }
    };
    const SID_KEY = 'rc-scenarijs-sid';

    const $ = id => document.getElementById(id);
    const screens = ['gate', 'admin', 'sheet'];
    function show(name) { screens.forEach(s => { $(s).hidden = s !== name; }); }

    let toastTimer;
    function toast(text) {
      const t = $('toast'); t.textContent = text; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
    }

    // Paroles nav reģistrjutīgas: "LONAS-7k3" = "lonas-7k3".
    const norm = s => s.trim().toLowerCase();
    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const indexId = pw => sha256('scn:' + pw);

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

    // ---------- Sesijas atjaunošana ----------
    let unsubProjects = null;
    let started = false;
    onAuthStateChanged(auth, async user => {
      if (started) return;
      started = true;
      if (!user) { show('gate'); return; }
      try {
        if ((await getDoc(doc(db, 'scnAdmins', user.uid))).exists()) { openAdmin(); return; }
      } catch {}
      const sid = lsGet(SID_KEY);
      if (sid) {
        try {
          const m = await getDoc(doc(db, 'scenarios', sid, 'members', user.uid));
          if (m.exists()) { openScenario(sid, m.data().role); return; }
        } catch {}
      }
      show('gate');
    });

    // ---------- Ieeja ar paroli ----------
    $('gate-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = norm($('gate-pw').value);
      if (!pw) return;
      const msg = $('gate-msg');
      msg.textContent = ''; msg.classList.remove('err');
      $('gate-btn').disabled = true;
      try {
        const user = auth.currentUser || (await signInAnonymously(auth)).user;
        const idx = await getDoc(doc(db, 'scnIndex', await indexId(pw)));
        if (idx.exists()) {
          const { sid, role } = idx.data();
          const mref = doc(db, 'scenarios', sid, 'members', user.uid);
          try { await deleteDoc(mref); } catch {}
          await setDoc(mref, { pw, role, at: serverTimestamp() });
          lsSet(SID_KEY, sid);
          openScenario(sid, role);
        } else {
          await setDoc(doc(db, 'scnAdmins', user.uid), { pw, at: serverTimestamp() });
          openAdmin();
        }
        $('gate-pw').value = '';
      } catch (err) {
        console.error(err);
        msg.textContent = err.code === 'auth/admin-restricted-operation' || err.code === 'auth/operation-not-allowed'
          ? 'Pieteikšanās šobrīd nav pieejama.'
          : 'Nepareiza parole / Wrong password';
        msg.classList.add('err');
      } finally {
        $('gate-btn').disabled = false;
      }
    });

    document.querySelectorAll('[data-logout]').forEach(b => b.addEventListener('click', async () => {
      if (unsubProjects) { unsubProjects(); unsubProjects = null; }
      closeScenario();
      const uid = auth.currentUser?.uid;
      if (uid) { try { await deleteDoc(doc(db, 'scnAdmins', uid)); } catch {} }
      lsSet(SID_KEY, null);
      await signOut(auth);
      show('gate');
    }));

    // ---------- Scenārijs ----------
    // S = atvērtais scenārijs. role: 'admin' | 'rw' | 'ro' | 'dj'.
    let S = null;
    let map = null, marker = null;
    const tr = k => (T[S?.data?.lang] || T.lv)[k];
    const canWrite = () => S && (S.role === 'admin' || S.role === 'rw');
    const canRow = r => canWrite() || (S.role === 'dj' && (r.cats || []).includes('dj'));
    const sref = () => doc(db, 'scenarios', S.sid);
    const rref = id => doc(db, 'scenarios', S.sid, 'rows', id);

    // Rakstīšana ar nelielu aizturi, lai katrs burts nav atsevišķs ieraksts.
    const timers = new Map();
    function later(key, fn) {
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => { timers.delete(key); fn(); }, 400));
    }
    const fail = e => { console.error(e); toast('Neizdevās saglabāt / Could not save'); };

    function closeScenario() {
      if (!S) return;
      S.unsubs.forEach(u => u());
      S = null;
    }

    function openScenario(sid, role) {
      closeScenario();
      S = { sid, role, data: null, rows: new Map(), els: new Map(), sel: null, edit: false, centered: false, unsubs: [] };
      $('back-btn').hidden = role !== 'admin';
      $('rows').querySelectorAll('.srow:not(.shead), .sheet-empty').forEach(el => el.remove());
      show('sheet');
      ensureMap();

      S.unsubs.push(onSnapshot(sref(), snap => {
        if (!snap.exists()) {
          lsSet(SID_KEY, null);
          role === 'admin' ? openAdmin() : show('gate');
          return;
        }
        S.data = snap.data();
        renderAll();
      }, err => { console.error(err); show('gate'); }));

      S.unsubs.push(onSnapshot(collection(db, 'scenarios', sid, 'rows'), snap => {
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') S.rows.delete(ch.doc.id);
          else S.rows.set(ch.doc.id, ch.doc.data());
        });
        renderRows();
      }, err => console.error(err)));
    }

    $('back-btn').addEventListener('click', () => openAdmin());

    function renderAll() {
      const lang = S.data.lang || 'lv';
      document.documentElement.lang = lang;
      document.querySelectorAll('#sheet [data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
      $('cat-name').placeholder = tr('newCat');
      renderVenue();
      renderCats();
      renderRows();
    }

    // ----- Vieta, adrese, karte -----
    function setVal(el, v) { if (document.activeElement !== el && el.value !== (v || '')) el.value = v || ''; }
    function renderVenue() {
      const w = canWrite();
      for (const id of ['v-name', 'v-addr']) $(id).readOnly = !w;
      setVal($('v-name'), S.data.place);
      setVal($('v-addr'), S.data.address);
      $('v-find').hidden = !w;
      $('v-name').placeholder = w ? tr('venue') : '';
      $('v-addr').placeholder = w ? tr('address') : '';
      renderMarker();
    }
    $('v-name').addEventListener('input', e => later('place', () =>
      updateDoc(sref(), { place: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));
    $('v-addr').addEventListener('input', e => later('address', () =>
      updateDoc(sref(), { address: e.target.value, updatedAt: serverTimestamp() }).catch(fail)));

    function ensureMap() {
      if (map || !window.L) { map && setTimeout(() => map.invalidateSize(), 50); return; }
      map = L.map('map', { scrollWheelZoom: false }).setView([56.88, 24.6], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);
      map.on('click', e => {
        if (!canWrite()) return;
        updateDoc(sref(), { lat: e.latlng.lat, lng: e.latlng.lng, updatedAt: serverTimestamp() }).catch(fail);
      });
    }
    function renderMarker() {
      if (!map) return;
      const { lat, lng } = S.data;
      if (lat == null || lng == null) {
        if (marker) { marker.remove(); marker = null; }
        if (!S.centered) { map.setView([56.88, 24.6], 6); S.centered = true; }
        return;
      }
      if (!marker) marker = L.circleMarker([lat, lng], { radius: 9, color: '#fff', weight: 2.5, fillColor: '#B07320', fillOpacity: 1 }).addTo(map);
      else marker.setLatLng([lat, lng]);
      if (!S.centered) { map.setView([lat, lng], 13); S.centered = true; }
    }
    $('v-find').addEventListener('click', async () => {
      const q = $('v-addr').value.trim();
      if (!q) return;
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=lv&q=' + encodeURIComponent(q));
        const [hit] = await res.json();
        if (!hit) { toast(tr('notFound')); return; }
        const lat = +hit.lat, lng = +hit.lon;
        map.setView([lat, lng], 14);
        await updateDoc(sref(), { address: q, lat, lng, updatedAt: serverTimestamp() });
      } catch (e) { fail(e); }
    });

    // ----- Kategorijas -----
    function renderCats() {
      const box = $('cat-list');
      box.replaceChildren();
      const cats = S.data.cats || [];
      if (S.sel && !cats.some(c => c.id === S.sel)) S.sel = null;
      for (const c of cats) {
        const n = [...S.rows.values()].filter(r => (r.cats || []).includes(c.id)).length;
        const wrap = document.createElement('div');
        wrap.className = 'cat' + (S.sel === c.id ? ' sel' : '');
        const b = document.createElement('button'); b.className = 'cat-btn'; b.type = 'button';
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = c.name;
        const cnt = document.createElement('span'); cnt.className = 'n'; cnt.textContent = n || '';
        b.append(nm, cnt);
        b.addEventListener('click', () => { S.sel = S.sel === c.id ? null : c.id; renderCats(); renderRows(); });
        wrap.append(b);
        // Dzēst var tikai "Labot" režīmā. DJ paliek vienmēr — uz to balstās "lasīt + DJ" parole.
        if (S.edit && canWrite() && c.id !== 'dj') {
          const x = document.createElement('button'); x.className = 'cat-x'; x.type = 'button'; x.textContent = '×';
          x.addEventListener('click', () => deleteCat(c.id));
          wrap.append(x);
        }
        box.append(wrap);
      }
      $('cat-add').hidden = !canWrite();
      $('edit-btn').hidden = !canWrite();
      $('edit-btn').textContent = S.edit ? tr('done') : tr('edit');
      $('add-row').hidden = !canWrite();
    }

    $('cat-add').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('cat-name').value.trim();
      if (!name) return;
      const id = slug(name) + '-' + Math.random().toString(36).slice(2, 6);
      $('cat-name').value = '';
      updateDoc(sref(), { cats: [...(S.data.cats || []), { id, name }], updatedAt: serverTimestamp() }).catch(fail);
    });

    async function deleteCat(id) {
      try {
        await updateDoc(sref(), { cats: (S.data.cats || []).filter(c => c.id !== id), updatedAt: serverTimestamp() });
        const b = writeBatch(db);
        for (const [rid, r] of S.rows) if ((r.cats || []).includes(id)) b.update(rref(rid), { cats: arrayRemove(id) });
        await b.commit();
      } catch (e) { fail(e); }
    }

    $('edit-btn').addEventListener('click', () => { S.edit = !S.edit; renderCats(); renderRows(); });

    // ----- Rindas -----
    function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    window.addEventListener('resize', () => document.querySelectorAll('#rows textarea').forEach(autosize));

    function makeRow(id) {
      const el = document.createElement('div');
      el.className = 'srow';
      el.innerHTML = '<button class="mark" type="button"><span></span></button>'
        + '<input class="cell c-time" maxlength="20" />'
        + '<div class="c-ev"><textarea class="cell" rows="1" maxlength="2000"></textarea><div class="tags"></div></div>'
        + '<textarea class="cell c-note" rows="1" maxlength="2000"></textarea>'
        + '<button class="del" type="button">×</button>';
      const [time, ev, note] = [el.querySelector('.c-time'), el.querySelector('.c-ev textarea'), el.querySelector('.c-note')];
      const bind = (input, field) => input.addEventListener('input', () => {
        if (input.tagName === 'TEXTAREA') autosize(input);
        later(id + field, () => updateDoc(rref(id), { [field]: input.value }).catch(fail));
      });
      bind(time, 't'); bind(ev, 'ev'); bind(note, 'note');
      el.querySelector('.mark').addEventListener('click', () => {
        const r = S.rows.get(id);
        if (!r || !S.sel) return;
        const on = (r.cats || []).includes(S.sel);
        updateDoc(rref(id), { cats: on ? arrayRemove(S.sel) : arrayUnion(S.sel) }).catch(fail);
      });
      el.querySelector('.del').addEventListener('click', () => deleteDoc(rref(id)).catch(fail));
      el._f = { time, ev, note, tags: el.querySelector('.tags'), mark: el.querySelector('.mark'), del: el.querySelector('.del') };
      return el;
    }

    let pendingFocus = null;
    function renderRows() {
      if (!S || !S.data) return;
      const box = $('rows');
      const names = Object.fromEntries((S.data.cats || []).map(c => [c.id, c.name]));
      const list = [...S.rows.entries()].sort((a, b) => (a[1].order || 0) - (b[1].order || 0));

      for (const [id, el] of S.els) if (!S.rows.has(id)) { el.remove(); S.els.delete(id); }
      box.querySelector('.sheet-empty')?.remove();
      if (!list.length) {
        const p = document.createElement('div'); p.className = 'sheet-empty'; p.textContent = tr('empty');
        box.append(p);
      }

      list.forEach(([id, r], i) => {
        let el = S.els.get(id);
        if (!el) { el = makeRow(id); S.els.set(id, el); }
        const f = el._f;
        const editable = canRow(r);
        for (const [input, v] of [[f.time, r.t], [f.ev, r.ev], [f.note, r.note]]) {
          input.readOnly = !editable;
          setVal(input, v);
        }
        f.time.placeholder = editable ? '00:00' : '';
        const cats = r.cats || [];
        f.tags.replaceChildren(...cats.filter(c => names[c]).map(c => {
          const s = document.createElement('span'); s.className = 'tag'; s.textContent = names[c]; return s;
        }));
        f.mark.disabled = !(S.sel && canWrite());
        f.mark.classList.toggle('on', !!S.sel && cats.includes(S.sel));
        f.del.disabled = !(S.edit && canWrite());
        el.classList.toggle('hl', !!S.sel && cats.includes(S.sel));
        el.classList.toggle('dim', !!S.sel && !cats.includes(S.sel));
        // Kārtība: pārvieto tikai, ja rinda nav savā vietā (lai nepazūd fokuss).
        const at = box.children[i + 1];
        if (at !== el) box.insertBefore(el, at || null);
      });
      requestAnimationFrame(() => box.querySelectorAll('textarea').forEach(autosize));
      if (pendingFocus && S.els.has(pendingFocus)) { S.els.get(pendingFocus)._f.time.focus(); pendingFocus = null; }
      renderCatCounts();
    }
    function renderCatCounts() {
      const cats = S.data.cats || [];
      $('cat-list').querySelectorAll('.cat').forEach((wrap, i) => {
        const c = cats[i]; if (!c) return;
        const n = [...S.rows.values()].filter(r => (r.cats || []).includes(c.id)).length;
        wrap.querySelector('.n').textContent = n || '';
      });
    }

    $('add-row').addEventListener('click', async () => {
      const last = Math.max(0, ...[...S.rows.values()].map(r => r.order || 0));
      try {
        const ref = await addDoc(collection(db, 'scenarios', S.sid, 'rows'), {
          t: '', ev: '', note: '', cats: S.sel ? [S.sel] : [], order: last + 1000
        });
        pendingFocus = ref.id;
        renderRows();
      } catch (e) { fail(e); }
    });

    // ---------- Admin: saraksts ----------
    const keysCache = new Map();
    function openAdmin() {
      closeScenario();
      show('admin');
      if (unsubProjects) return;
      unsubProjects = onSnapshot(query(collection(db, 'scenarios'), orderBy('createdAt', 'desc')), async snap => {
        const projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await Promise.all(projects.filter(p => !keysCache.has(p.id)).map(async p => {
          try { keysCache.set(p.id, (await getDoc(doc(db, 'scenarios', p.id, 'keys', 'main'))).data() || {}); }
          catch { keysCache.set(p.id, {}); }
        }));
        renderProjects(projects);
      }, err => { console.error(err); toast('Neizdevās ielādēt projektus'); });
    }

    function renderProjects(projects) {
      const box = $('projects');
      box.replaceChildren();
      $('projects-empty').hidden = projects.length > 0;
      for (const p of projects) {
        const keys = keysCache.get(p.id) || {};
        const card = document.createElement('article');
        card.className = 'proj';

        const top = document.createElement('div'); top.className = 'proj-top';
        const h = document.createElement('h2'); h.textContent = p.name;
        const lang = document.createElement('span'); lang.className = 'lang'; lang.textContent = p.lang || 'lv';
        top.append(h, lang);

        const list = document.createElement('div'); list.className = 'pw-list';
        for (const r of ROLES) {
          const row = document.createElement('div'); row.className = 'pw';
          const l = document.createElement('span'); l.className = 'pw-label'; l.textContent = ROLE_LABEL[r];
          const v = document.createElement('button'); v.className = 'pw-val'; v.type = 'button';
          v.textContent = keys[r] || '—'; v.title = 'Kopēt';
          v.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(keys[r] || ''); toast('Parole nokopēta'); } catch {}
          });
          row.append(l, v);
          list.append(row);
        }

        const actions = document.createElement('div'); actions.className = 'proj-actions';
        const edit = document.createElement('button'); edit.className = 'btn btn-line btn-sm'; edit.textContent = 'Labot';
        edit.addEventListener('click', () => openModal(p));
        const open = document.createElement('button'); open.className = 'btn btn-dark btn-sm'; open.textContent = 'Atvērt';
        open.addEventListener('click', () => openScenario(p.id, 'admin'));
        actions.append(edit, open);

        card.append(top, list, actions);
        box.append(card);
      }
    }

    // ---------- Admin: projekta forma ----------
    let editing = null; // null = jauns projekts
    const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 20) || 'projekts';
    function genPw() {
      const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
      const rnd = crypto.getRandomValues(new Uint8Array(4));
      return slug($('f-name').value) + '-' + [...rnd].map(n => abc[n % abc.length]).join('');
    }
    document.querySelectorAll('[data-gen]').forEach(b =>
      b.addEventListener('click', () => { $(b.dataset.gen).value = genPw(); }));

    function openModal(p) {
      editing = p;
      $('modal-title').textContent = p ? 'Labot projektu' : 'Jauns projekts';
      $('f-name').value = p ? p.name : '';
      $('f-lang').value = p ? (p.lang || 'lv') : 'lv';
      const keys = p ? (keysCache.get(p.id) || {}) : {};
      for (const r of ROLES) $('f-' + r).value = keys[r] || '';
      $('modal-msg').textContent = '';
      $('danger').hidden = !p;
      $('del-confirm').hidden = true;
      $('modal').hidden = false;
      $('f-name').focus();
    }
    function closeModal() { $('modal').hidden = true; editing = null; }
    $('new-btn').addEventListener('click', () => openModal(null));
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

    $('proj-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = $('f-name').value.trim();
      const lang = $('f-lang').value;
      const pws = Object.fromEntries(ROLES.map(r => [r, norm($('f-' + r).value)]));
      const err = t => { $('modal-msg').textContent = t; };

      if (!name) return err('Ieraksti nosaukumu.');
      if (ROLES.some(r => !pws[r])) return err('Aizpildi visas trīs paroles.');
      if (new Set(ROLES.map(r => pws[r])).size < 3) return err('Visām trim parolēm jābūt atšķirīgām.');
      if (ROLES.some(r => pws[r] === 'pasmaidi')) return err('Šī parole ir rezervēta.');

      const old = editing ? (keysCache.get(editing.id) || {}) : {};
      const changed = ROLES.filter(r => pws[r] !== old[r]);

      $('modal-save').disabled = true;
      try {
        // Parolei jābūt unikālai visos projektos.
        for (const r of changed) {
          if ((await getDoc(doc(db, 'scnIndex', await indexId(pws[r])))).exists())
            return err(`Parole "${pws[r]}" jau ir aizņemta citā projektā.`);
        }

        const sid = editing ? editing.id : doc(collection(db, 'scenarios')).id;
        const b = writeBatch(db);
        if (editing) {
          b.update(doc(db, 'scenarios', sid), { name, lang, updatedAt: serverTimestamp() });
        } else {
          b.set(doc(db, 'scenarios', sid), {
            name, lang, place: '', address: '', lat: null, lng: null, cats: DEFAULT_CATS[lang] || DEFAULT_CATS.lv,
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
        }
        b.set(doc(db, 'scenarios', sid, 'keys', 'main'), pws);
        for (const r of changed) {
          if (old[r]) b.delete(doc(db, 'scnIndex', await indexId(old[r])));
          b.set(doc(db, 'scnIndex', await indexId(pws[r])), { sid, role: r });
        }
        await b.commit();

        // Mainīta parole = vecā vairs neder arī tiem, kas jau ir iekšā.
        if (editing) {
          for (const r of changed) {
            const ms = await getDocs(query(collection(db, 'scenarios', sid, 'members'), where('role', '==', r)));
            await Promise.all(ms.docs.map(m => deleteDoc(m.ref)));
          }
        }
        keysCache.set(sid, pws);
        closeModal();
        toast(editing ? 'Saglabāts' : 'Projekts izveidots');
      } catch (ex) {
        console.error(ex);
        err('Neizdevās saglabāt.');
      } finally {
        $('modal-save').disabled = false;
      }
    });

    // ---------- Admin: dzēšana (paslēpta aiz "Labot") ----------
    $('del-show').addEventListener('click', () => { $('del-confirm').hidden = false; });
    $('del-yes').addEventListener('click', async () => {
      if (!editing) return;
      const sid = editing.id;
      const keys = keysCache.get(sid) || {};
      $('del-yes').disabled = true;
      try {
        const b = writeBatch(db);
        for (const sub of ['rows', 'members']) {
          (await getDocs(collection(db, 'scenarios', sid, sub))).forEach(d => b.delete(d.ref));
        }
        for (const r of ROLES) if (keys[r]) b.delete(doc(db, 'scnIndex', await indexId(keys[r])));
        b.delete(doc(db, 'scenarios', sid, 'keys', 'main'));
        b.delete(doc(db, 'scenarios', sid));
        await b.commit();
        keysCache.delete(sid);
        closeModal();
        toast('Projekts izdzēsts');
      } catch (ex) {
        console.error(ex);
        $('modal-msg').textContent = 'Neizdevās izdzēst.';
      } finally {
        $('del-yes').disabled = false;
      }
    });
  </script>
</body>
</html>
