<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review — DJ Roadchanger</title>
  <meta name="description" content="Leave a Google review for DJ Roadchanger." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://roadchanger.com/review/" />

  <!-- Instant redirect uz Google atsauksmes formu.
       SAITE IR TIKAI VIENĀ VIETĀ ŠAJĀ FAILĀ (meta refresh) un dublēta pogā + JS zemāk. -->
  <meta http-equiv="refresh" content="0; url=https://g.page/r/CZjQXSVaRA0PEBM/review" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    nav {
      display: flex;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }

    .redirect-section { max-width: 560px; margin: 0 auto; padding: 5rem 2rem; text-align: center; }
    .redirect-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #2C2416;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }
    .redirect-sub { font-size: 15px; color: #7A5C38; line-height: 1.7; font-weight: 300; margin-bottom: 2rem; }
    .btn-dark {
      display: inline-block;
      background: #2C2416;
      color: #F5ECD8;
      font-size: 14px;
      padding: 13px 30px;
      border-radius: 3px;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .btn-dark:hover { background: #3D3020; }
    .redirect-note { font-size: 12px; color: #A08060; line-height: 1.7; margin-top: 1.5rem; }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .redirect-section { padding: 3rem 1.25rem; }
      .redirect-title { font-size: 22px; }
      .redirect-sub { font-size: 14px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
  </nav>

  <div class="redirect-section">
    <h1 class="redirect-title">Thank you for leaving a review</h1>
    <p class="redirect-sub">Taking you to Google&hellip;</p>
    <a class="btn-dark" href="https://g.page/r/CZjQXSVaRA0PEBM/review" rel="noopener">Continue to Google</a>
    <p class="redirect-note">You need to be signed in with a Google account. It takes less than a minute.</p>
  </div>

  <script>
    /* Redirect uzreiz. meta refresh augšā ir rezerves variants, ja JS izslēgts. */
    window.location.replace("https://g.page/r/CZjQXSVaRA0PEBM/review");
  </script>

</body>
</html>
