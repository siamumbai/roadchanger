<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Live Roses — Roadchanger | Riga, Latvia</title>
  <meta name="description" content="Elegant performers in breathtaking floral costumes — floor-length rose gowns, dramatic headpieces and an atmosphere that stops guests in their tracks. They move through your event and become part of the memory." />
  <link rel="canonical" href="https://roadchanger.com/rozes/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DJ Roadchanger" />
  <meta property="og:title" content="Live Roses — Roadchanger | Riga, Latvia" />
  <meta property="og:description" content="Elegant performers in breathtaking floral costumes — floor-length rose gowns, dramatic headpieces and an atmosphere that stops guests in their tracks. They move through your event and become part of the memory." />
  <meta property="og:url" content="https://roadchanger.com/rozes/" />
  <meta property="og:image" content="https://roadchanger.com/images/rozes11.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    /* Header - tāds pats kā galvenajā lapā (bez Book now) */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { font-size: 13px; color: #8A6840; text-decoration: none; letter-spacing: 0.05em; }
    .nav-links a:hover { color: #B07320; }

    /* Bildes - kartiņas platumā, augstums dabiskais */
    .media-section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 3rem; }
    .media-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #2C2416;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .media-subtitle {
      font-size: 15px;
      color: #7A5C38;
      line-height: 1.7;
      font-weight: 300;
      max-width: 640px;
      margin-bottom: 2rem;
    }
    .mobile-br { display: none; }
    /* Kolāža: bildes dažādos izmēros, kolonnas nesakrīt rindās */
    .rz-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(43, minmax(0, 1fr));
      aspect-ratio: 12 / 21.5;
      margin: 0 -0.25rem;
    }
    .rz { position: relative; }
    .rz img {
      position: absolute;
      top: 0.25rem;
      left: 0.25rem;
      width: calc(100% - 0.5rem);
      height: calc(100% - 0.5rem);
      object-fit: cover;
      display: block;
      border-radius: 6px;
      border: 0.5px solid #DEC898;
    }
    .a11 { grid-area: 1 / 1 / 15 / 7; }
    .a1 { grid-area: 1 / 7 / 9 / 13; }
    .a10 { grid-area: 9 / 7 / 17 / 10; }
    .a2 { grid-area: 9 / 10 / 18 / 13; }
    .a6 { grid-area: 15 / 1 / 25 / 4; }
    .a3 { grid-area: 15 / 4 / 24 / 7; }
    .a4 { grid-area: 17 / 7 / 27 / 10; }
    .a7 { grid-area: 18 / 10 / 27 / 13; }
    .a9 { grid-area: 25 / 1 / 35 / 4; }
    .a5 { grid-area: 24 / 4 / 35 / 7; }
    .a8 { grid-area: 27 / 7 / 36 / 13; }
    .a12 { grid-area: 35 / 1 / 44 / 7; }
    .a13 { grid-area: 36 / 7 / 44 / 13; }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .nav-links { display: none; }
      .mobile-br { display: inline; }
      .media-section { padding: 0.75rem 1rem 1.25rem; }
      .media-title { font-size: 24px; margin-bottom: 0.3rem; }
      .media-subtitle { font-size: 14px; margin-bottom: 1.25rem; }
      .rz-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(91, minmax(0, 1fr));
        aspect-ratio: 6 / 45.5;
        margin: 0 -0.125rem;
      }
      .rz img {
        top: 0.125rem;
        left: 0.125rem;
        width: calc(100% - 0.25rem);
        height: calc(100% - 0.25rem);
      }
      .a11 { grid-area: 1 / 1 / 15 / 7; }
      .a1 { grid-area: 15 / 1 / 23 / 7; }
      .a10 { grid-area: 23 / 1 / 31 / 4; }
      .a2 { grid-area: 23 / 4 / 32 / 7; }
      .a6 { grid-area: 31 / 1 / 42 / 4; }
      .a3 { grid-area: 32 / 4 / 41 / 7; }
      .a7 { grid-area: 42 / 1 / 50 / 4; }
      .a4 { grid-area: 41 / 4 / 50 / 7; }
      .a9 { grid-area: 50 / 1 / 61 / 4; }
      .a5 { grid-area: 50 / 4 / 61 / 7; }
      .a8 { grid-area: 61 / 1 / 69 / 7; }
      .a12 { grid-area: 69 / 1 / 77 / 7; }
      .a13 { grid-area: 77 / 1 / 92 / 7; }
      .a13 img { object-position: center !important; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
    <div class="nav-links">
      <a href="/dj/">DJ sets</a>
      <a href="/fire/">Fire show</a>
      <a href="/#about">About</a>
    </div>
  </nav>

  <div class="media-section">
    <h1 class="media-title">Live Roses</h1>
    <p class="media-subtitle">Elegant performers in breathtaking floral costumes — floor-length rose gowns, dramatic headpieces and an atmosphere that stops guests in their tracks.<br>They move through your event and become part of the memory.</p>
    <div class="rz-grid">
      <div class="rz a11"><img src="/images/rozes11.jpg" alt="Live Roses performer under blue stage lights" /></div>
      <div class="rz a1"><img src="/images/rozes1.jpg" alt="Live Roses performers at an event" /></div>
      <div class="rz a10"><img src="/images/rozes10.jpg" alt="Red and white Live Roses performers in a light beam" /></div>
      <div class="rz a2"><img src="/images/rozes2.jpg" alt="Red Live Roses performer" /></div>
      <div class="rz a6"><img loading="lazy" decoding="async" src="/images/rozes6.jpg" alt="Pianist in red with a Live Roses performer" style="object-position:40% center;" /></div>
      <div class="rz a3"><img loading="lazy" decoding="async" src="/images/rozes3.jpg" alt="White Live Roses performer beside a harp" /></div>
      <div class="rz a4"><img loading="lazy" decoding="async" src="/images/rozes4.jpg" alt="White Live Roses performer in blue light" /></div>
      <div class="rz a7"><img loading="lazy" decoding="async" src="/images/rozes7.jpg" alt="Pianist with a red Live Roses performer" /></div>
      <div class="rz a9"><img loading="lazy" decoding="async" src="/images/rozes9.jpg" alt="Red Live Roses performer among dinner tables" style="object-position:55% center;" /></div>
      <div class="rz a5"><img loading="lazy" decoding="async" src="/images/rozes5.jpg" alt="White Live Roses performer by a window" style="object-position:70% center;" /></div>
      <div class="rz a8"><img loading="lazy" decoding="async" src="/images/rozes8.jpg" alt="Live Roses performer behind an oyster and champagne bath" style="object-position:center 90%;" /></div>
      <div class="rz a12"><img loading="lazy" decoding="async" src="/images/rozes12.jpg" alt="Harpist with Live Roses performers and guests" style="object-position:75% center;" /></div>
      <div class="rz a13"><img loading="lazy" decoding="async" src="/images/rozes13.jpg" alt="White Live Roses performer among dinner tables under a light beam" style="object-position:center 62%;" /></div>
    </div>
  </div>

</body>
</html>
