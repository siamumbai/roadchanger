<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emīls Ašmanis video portfolio</title>
  <meta name="description" content="Emīla Ašmaņa video portfolio — roadchanger.com" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#F4EEE4;
      --ink:#2A241E;
      --muted:#7A6C5C;
      --accent:#B07320;
      --accent-dark:#8F5C15;
      --line:rgba(42,36,30,.12);
      --shadow:0 18px 40px -18px rgba(42,36,30,.35);
      --radius:14px;
    }

    *,*::before,*::after{ box-sizing:border-box; }

    /* Root font scales gently with the viewport, and everything below is in
       rem — so the whole layout keeps the same proportions across screen
       sizes and browser zoom, instead of just reflowing. */
    html{
      font-size: clamp(15px, 0.5vw + 13.2px, 18px);
      -webkit-text-size-adjust:100%;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }

    a{ color:inherit; }

    .wrap{ width:min(92%,68rem); margin-inline:auto; }

    /* Header */
    .site-head{ padding: clamp(1.1rem,2.5vw,1.8rem) 0; }
    .brand{
      display:inline-flex; align-items:center; gap:.5rem;
      font-weight:600; letter-spacing:.14em; text-transform:uppercase;
      font-size:.78rem; text-decoration:none; color:var(--muted);
      transition:color .2s ease;
    }
    .brand::before{ content:"←"; font-size:.9em; }
    .brand:hover{ color:var(--accent); }

    /* Intro */
    .intro{
      padding: clamp(1.6rem,5vw,4rem) 0 clamp(1.6rem,4vw,3rem);
      border-bottom:1px solid var(--line);
    }
    .eyebrow{
      margin:0 0 clamp(.6rem,1.5vw,1rem);
      font-weight:600; letter-spacing:.32em; text-transform:uppercase;
      font-size:clamp(.64rem,1.4vw,.72rem); color:var(--accent);
    }
    .name{
      margin:0;
      font-family:"Fraunces",Georgia,serif;
      font-weight:400;
      font-size:clamp(2.6rem,8vw,5.4rem);
      line-height:1.02; letter-spacing:-.01em;
    }

    /* Gallery */
    .gallery{ padding: clamp(1.8rem,5vw,3.6rem) 0 clamp(2.5rem,7vw,5rem); }
    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(min(100%,28rem),1fr));
      gap: clamp(1.2rem,3vw,2.4rem);
    }
    .video{ margin:0; }

    .frame{
      position:relative;
      aspect-ratio:16/9;      /* keeps every video proportional at any size */
      width:100%;
      border-radius:var(--radius);
      overflow:hidden;
      background:#000;
      box-shadow:var(--shadow);
    }
    .frame iframe{
      position:absolute; inset:0; width:100%; height:100%; border:0; display:block;
    }

    /* Click-to-play cover — video plays here on the page, not on YouTube */
    .facade{
      position:absolute; inset:0; width:100%; height:100%;
      margin:0; padding:0; border:0; cursor:pointer; background:#000; display:block;
    }
    .facade img{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; display:block;
      transition:transform .5s ease, opacity .3s ease;
    }
    .facade:hover img{ transform:scale(1.04); opacity:.85; }
    .play{
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:clamp(3.6rem,9vw,4.8rem); aspect-ratio:1; border-radius:50%;
      background:var(--accent); display:grid; place-items:center;
      box-shadow:0 10px 30px -6px rgba(0,0,0,.5);
      transition:transform .25s ease, background .25s ease;
    }
    .facade:hover .play{ transform:translate(-50%,-50%) scale(1.08); background:var(--accent-dark); }
    .play svg{ width:38%; height:38%; margin-left:8%; fill:#fff; }
    .facade:focus-visible{ outline:3px solid var(--accent-dark); outline-offset:3px; }

    /* Footer */
    footer{
      padding: clamp(1.4rem,3vw,2.2rem) 0 clamp(2rem,4vw,3rem);
      border-top:1px solid var(--line);
      font-size:.8rem; color:var(--muted); letter-spacing:.02em;
    }

    @media (prefers-reduced-motion:reduce){
      *{ transition:none !important; }
      .facade:hover img{ transform:none; }
    }
  </style>
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="/">roadchanger.com</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="wrap">
        <p class="eyebrow">Video portfolio</p>
        <h1 class="name">Emīls Ašmanis</h1>
      </div>
    </section>

    <section class="gallery">
      <div class="wrap">
        <div class="video-grid">

          <figure class="video">
            <div class="frame">
              <button class="facade" type="button" data-id="-5ydRSSxoSk" aria-label="Atskaņot 1. video">
                <img src="https://i.ytimg.com/vi/-5ydRSSxoSk/maxresdefault.jpg"
                     onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/-5ydRSSxoSk/hqdefault.jpg';"
                     alt="Video priekšskatījums" loading="lazy" />
                <span class="play" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </span>
              </button>
            </div>
          </figure>

          <figure class="video">
            <div class="frame">
              <button class="facade" type="button" data-id="BzWU7PHq4dk" aria-label="Atskaņot 2. video">
                <img src="https://i.ytimg.com/vi/BzWU7PHq4dk/maxresdefault.jpg"
                     onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/BzWU7PHq4dk/hqdefault.jpg';"
                     alt="Video priekšskatījums" loading="lazy" />
                <span class="play" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </span>
              </button>
            </div>
          </figure>

        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="yr"></span> roadchanger.com</div>
  </footer>

  <script>
    document.querySelectorAll('.facade').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + id +
                     '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
        iframe.setAttribute('title', 'Video');
        iframe.setAttribute('allow',
          'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        var frame = btn.parentNode;   // .frame
        frame.innerHTML = '';
        frame.appendChild(iframe);
      });
    });

    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
