<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technical Rider — DJ Roadchanger</title>
  <meta name="description" content="Technical rider — Roadchanger." />
  <link rel="canonical" href="https://roadchanger.com/rider/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    /* Header - tikai logo */
    nav {
      display: flex;
      align-items: center;
      padding: 1.25rem 3rem;
      background: #FFFBF5;
      border-bottom: 0.5px solid #EAD9B8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }

    /* Saturs */
    .rider-section { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem 3rem; }
    .rider-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #2C2416;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    .rider-subtitle {
      font-size: 15px;
      color: #7A5C38;
      line-height: 1.7;
      font-weight: 300;
      margin-top: 1.5rem;
      text-align: center;
    }
    .rider-subtitle a {
      color: #B07320;
      text-decoration: none;
      font-weight: 400;
    }
    .rider-subtitle a:hover { text-decoration: underline; }

    /* Bilde - augstums dabiskais */
    .rider-card {
      border-radius: 10px;
      overflow: hidden;
      border: 0.5px solid #E0CCA4;
      box-shadow: 0 4px 18px rgba(44,36,22,0.08);
      background: #FFFBF5;
    }
    .rider-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .rider-section { padding: 1.5rem 1rem 2rem; }
      .rider-title { font-size: 24px; }
      .rider-subtitle { font-size: 14px; margin-top: 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Roadchanger</a>
  </nav>

  <div class="rider-section">
    <h1 class="rider-title">Technical Rider</h1>
    <div class="rider-card">
      <img src="/images/rider1.jpg" alt="Technical rider" />
    </div>
    <p class="rider-subtitle">If you have any questions please call <a href="tel:+37120031578">+371 20031578</a></p>
  </div>

</body>
</html>
