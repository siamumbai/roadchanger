  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF5; color: #2C2416; font-family: 'Lato', Arial, sans-serif; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 3rem; background: #FFFBF5; border-bottom: 0.5px solid #EAD9B8; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #2C2416; text-transform: uppercase; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { font-size: 13px; color: #8A6840; text-decoration: none; letter-spacing: 0.05em; }
    .nav-links a:hover { color: #B07320; }
    .nav-cta { background: #2C2416; color: #F5ECD8; font-size: 13px; padding: 9px 22px; border-radius: 3px; text-decoration: none; letter-spacing: 0.06em; }
    .nav-cta:hover { background: #3D3020; }

    .fire-section { padding: 5rem 3rem; }
    .fire-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; max-width: 1200px; margin: 0 auto; align-items: start; }
    .fire-video { aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 18px rgba(44,36,22,0.08); }
    .fire-video iframe { width: 100%; height: 100%; border: none; }
    .fire-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .gallery-item { aspect-ratio: 1; background: #EDD9B4; border-radius: 6px; border: 0.5px solid #DEC898; display: flex; align-items: center; justify-content: center; }
    .gallery-placeholder { font-size: 12px; color: #B8935A; letter-spacing: 0.08em; text-align: center; }

    footer { background: #1E1810; padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-top: 0.5px solid #3D3020; margin-top: 5rem; }
    .footer-logo { font-family: 'Libre Baskerville', Georgia, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #C4A06A; text-transform: uppercase; }
    .footer-sub { font-size: 11px; color: #5C4028; margin-top: 4px; }
    .footer-links { display: flex; gap: 2rem; flex-wrap: wrap; }
    .footer-links a { font-size: 12px; color: #6B5035; text-decoration: none; }
    .footer-links a:hover { color: #C4A06A; }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .fire-section { padding: 3rem 1.5rem; }
      .fire-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .fire-gallery { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 1.5rem; flex-direction: column; align-items: flex-start; }
    }
